<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ShymATC-CHAMP</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
[data-theme="dark"] {
  --bg:#0a0a0f; --surface:#111118; --surface2:#16161f; --surface3:#1c1c28;
  --border:#1e1e2e; --border2:#2a2a3e;
  --accent:#e8ff47; --accent2:#47a8ff; --accent3:#ff6b47;
  --gold:#ffd700; --silver:#a0a0c0; --bronze:#cd7f32;
  --text:#e8e8f0; --text2:#a9a9a9; --text3:#a9a9a9;
  --shadow:rgba(0,0,0,0.6); --glow:rgba(232,255,71,0.07);
  --header-bg:rgba(10,10,15,0.97);
}
[data-theme="light"] {
  --bg:#f0f0f5; --surface:#ffffff; --surface2:#f5f5fa; --surface3:#eaeaf2;
  --border:#dddde8; --border2:#c8c8dc;
  --accent:#1a7a00; --accent2:#0060cc; --accent3:#cc3300;
  --gold:#b8860b; --silver:#6060a0; --bronze:#8b4513;
  --text:#141420; --text2:#50507a; --text3:#9090b8;
  --shadow:rgba(0,0,0,0.1); --glow:rgba(26,122,0,0.04);
  --header-bg:rgba(255,255,255,0.97);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:"Avenir Next","Avenir","Plus Jakarta Sans",sans-serif;transition:background .3s,color .3s;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 40%,var(--glow) 0%,transparent 55%);pointer-events:none;z-index:0;transition:background .3s;}

/* HEADER */
.header{position:fixed;top:0;left:0;right:0;height:56px;background:var(--header-bg);border-bottom:1px solid var(--border);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:100;transition:background .3s,border-color .3s;}
.logo{display:flex;align-items:center;gap:9px;}
.logo-hex{width:28px;height:28px;background:var(--accent);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);animation:hpulse 3s ease-in-out infinite;transition:background .3s;}
@keyframes hpulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}
.logo-text{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;color:var(--text);transition:color .3s;}
.logo-text span{color:var(--accent);transition:color .3s;}
.hdr-right{display:flex;align-items:center;gap:10px;}
.live-badge{display:flex;align-items:center;gap:5px;font-family:'DM Mono',monospace;font-size:13px;color:var(--accent3);letter-spacing:1px;text-transform:uppercase;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--accent3);animation:blink 1.4s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.theme-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s;color:var(--text);}
.theme-btn:active{transform:scale(.92);}

/* SCROLL */
.scroll-root{position:fixed;top:56px;left:0;right:0;bottom:60px;overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:1;padding-bottom:8px;}
@supports(padding:max(0px)){
  .bottom-nav{height:calc(60px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);}
  .scroll-root{bottom:calc(60px + env(safe-area-inset-bottom));}
}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:60px;background:var(--header-bg);border-top:1px solid var(--border);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;z-index:100;transition:background .3s,border-color .3s;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border:none;background:transparent;font-family:"Avenir Next","Avenir","Plus Jakarta Sans",sans-serif;color:var(--text3);padding:0;transition:color .2s;}
.nav-item.active{color:var(--accent);}
.nav-icon{font-size:20px;transition:transform .2s;}
.nav-item.active .nav-icon{transform:scale(1.18);}
.nav-label{font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;}

/* PAGE */
.page{display:none;}
.page.active{display:block;}

/* SECTION TITLE */
.section-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:3px;display:flex;align-items:center;gap:8px;margin-bottom:12px;transition:color .3s;}
.section-title::before{content:'';width:3px;height:18px;background:var(--accent);border-radius:2px;flex-shrink:0;transition:background .3s;}

/* ── HOME ── */
.home-hero{margin:16px 16px 0;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;position:relative;overflow:hidden;transition:background .3s,border-color .3s;}
.home-hero::after{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;background:radial-gradient(circle,var(--glow) 0%,transparent 70%);pointer-events:none;}
.hero-eyebrow{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:6px;transition:color .3s;}
.hero-title{font-family:"Avenir Next","Avenir","Plus Jakarta Sans",sans-serif;font-weight:800;font-size:26px;letter-spacing:0px;margin-bottom:4px;transition:color .3s;}
.hero-sub{font-family:'DM Mono',monospace;font-size:14px;color:var(--text2);margin-bottom:16px;transition:color .3s;}
.hero-prog-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.prog-lbl{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:4px;transition:color .3s;}
.prog-val{font-family:'Bebas Neue',sans-serif;font-size:18px;margin-bottom:3px;transition:color .3s;}
.prog-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden;transition:background .3s;}
.prog-fill{height:100%;border-radius:2px;transition:width 1s ease;}

.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px 16px 0;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;position:relative;overflow:hidden;transition:background .3s,border-color .3s;}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.stat-card:nth-child(1)::before{background:var(--accent);}
.stat-card:nth-child(2)::before{background:var(--accent2);}
.stat-card:nth-child(3)::before{background:var(--accent3);}
.stat-card:nth-child(4)::before{background:var(--gold);}
.stat-lbl{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:6px;transition:color .3s;}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:36px;line-height:1;margin-bottom:3px;transition:color .3s;}
.stat-card:nth-child(1) .stat-val{color:var(--accent);}
.stat-card:nth-child(2) .stat-val{color:var(--accent2);}
.stat-card:nth-child(3) .stat-val{color:var(--accent3);}
.stat-card:nth-child(4) .stat-val{color:var(--gold);}
.stat-sub{font-size:14px;color:var(--text2);transition:color .3s;}

.events-wrap{padding:16px;}
.event-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.event-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:0 2px 2px 0;}
.event-card.type-football::before{background:var(--accent);}
.event-card.type-chess::before{background:var(--accent2);}
.event-card.type-tennis::before{background:var(--accent3);}
.event-card:active{transform:scale(.98);background:var(--surface2);}
.ev-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;transition:background .3s;}
.ev-icon.football{background:rgba(232,255,71,.1);}
.ev-icon.chess{background:rgba(71,168,255,.1);}
.ev-icon.tennis{background:rgba(255,107,71,.1);}
[data-theme="light"] .ev-icon.football{background:rgba(26,122,0,.1);}
[data-theme="light"] .ev-icon.chess{background:rgba(0,96,204,.1);}
[data-theme="light"] .ev-icon.tennis{background:rgba(204,51,0,.1);}
.ev-info{flex:1;min-width:0;}
.ev-name{font-size:14px;font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s;}
.ev-meta{font-family:'DM Mono',monospace;font-size:13px;color:var(--text3);transition:color .3s;}
.ev-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;}
.badge{font-family:'DM Mono',monospace;font-size:12px;padding:3px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:1px;}
.badge-live{background:rgba(232,255,71,.12);color:var(--accent);border:1px solid rgba(232,255,71,.25);}
.badge-done{background:var(--surface2);color:var(--text2);border:1px solid var(--border);}
[data-theme="light"] .badge-live{background:rgba(26,122,0,.1);color:var(--accent);border-color:rgba(26,122,0,.3);}
.ev-arrow{font-size:16px;color:var(--text3);}

/* ── STANDINGS ── */
.standings-wrap{padding:16px;}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .2s;color:var(--text2);font-family:"Avenir Next","Avenir","Plus Jakarta Sans",sans-serif;}
.chip.active{background:var(--accent);border-color:var(--accent);color:#0a0a0f;}
[data-theme="light"] .chip.active{color:#fff;}

.table-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:background .3s,border-color .3s;}
.t-head{display:grid;padding:10px 12px;border-bottom:1px solid var(--border);transition:border-color .3s;}
.col-t{grid-template-columns:28px 1fr 26px 26px 26px 28px 36px;}
.col-i{grid-template-columns:24px 1fr 30px 22px 22px 22px 46px;}
.th{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);text-align:center;transition:color .3s;}
.th.left{text-align:left;}

.t-row{display:grid;padding:11px 12px;border-bottom:1px solid var(--border);align-items:center;position:relative;transition:background .15s,border-color .3s;animation:rin .35s ease forwards;opacity:0;transform:translateX(-8px);}
.t-row:last-child{border-bottom:none;}
.t-row:active{background:var(--surface2);}
@keyframes rin{to{opacity:1;transform:translateX(0)}}
.t-row:nth-child(1){animation-delay:.04s}.t-row:nth-child(2){animation-delay:.08s}.t-row:nth-child(3){animation-delay:.12s}.t-row:nth-child(4){animation-delay:.16s}.t-row:nth-child(5){animation-delay:.20s}.t-row:nth-child(6){animation-delay:.24s}.t-row:nth-child(7){animation-delay:.28s}.t-row:nth-child(8){animation-delay:.32s}
.zone-line{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:0 2px 2px 0;}
.rk{font-family:'DM Mono',monospace;font-size:14px;color:var(--text3);text-align:center;transition:color .3s;}
.team-c{display:flex;align-items:center;gap:8px;}
.t-ava{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;}
.t-nm{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s;}
.cn{font-family:'DM Mono',monospace;font-size:14px;color:var(--text2);text-align:center;transition:color .3s;}
.cp{font-family:'Bebas Neue',sans-serif;font-size:20px;text-align:center;color:var(--text);transition:color .3s;}
.gp{color:var(--accent)!important;}.gn{color:var(--accent3)!important;}
.frow{display:flex;gap:2px;justify-content:center;}
.fd{width:14px;height:14px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;font-family:'DM Mono',monospace;}
.fw{background:rgba(232,255,71,.18);color:var(--accent);}
.fdraw{background:rgba(120,120,160,.2);color:var(--text2);}
.fl{background:rgba(255,107,71,.15);color:var(--accent3);}
[data-theme="light"] .fw{background:rgba(26,122,0,.15);color:var(--accent);}
[data-theme="light"] .fdraw{background:rgba(80,80,122,.15);color:var(--text2);}
[data-theme="light"] .fl{background:rgba(204,51,0,.12);color:var(--accent3);}

.legend{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap;}
.leg-item{display:flex;align-items:center;gap:5px;font-family:'DM Mono',monospace;font-size:9px;color:var(--text3);transition:color .3s;}
.leg-dot{width:8px;height:8px;border-radius:2px;}

/* ── MATCHES ── */
.matches-wrap{padding:16px;}
.ms-lbl{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);padding:6px 0 10px;transition:color .3s;}
.match-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;transition:background .3s,border-color .3s;}
.m-date{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:12px;transition:color .3s;}
.m-body{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;}
.m-team{font-size:13px;font-weight:700;transition:color .3s;}
.m-home{text-align:right;}.m-away{text-align:left;}
.m-score{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;text-align:center;color:var(--accent);background:rgba(232,255,71,.08);border-radius:8px;padding:3px 10px;min-width:64px;transition:background .3s,color .3s;}
[data-theme="light"] .m-score{background:rgba(26,122,0,.06);}
.mw{color:var(--accent);}.ml{color:var(--text3);}

.upc-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent2);border-radius:14px;padding:14px;margin-bottom:10px;transition:background .3s,border-color .3s;}
.upc-time{font-family:'DM Mono',monospace;font-size:13px;color:var(--accent2);margin-bottom:8px;transition:color .3s;}
.upc-teams{display:grid;grid-template-columns:1fr 32px 1fr;align-items:center;gap:6px;}
.upc-team{font-size:12px;font-weight:700;transition:color .3s;}
.upc-h{text-align:right;}.upc-a{text-align:left;}
.vs-b{font-family:'DM Mono',monospace;font-size:9px;border:1px solid var(--border2);border-radius:4px;padding:2px 4px;text-align:center;color:var(--text3);transition:all .3s;}

/* ── STATS ── */
.stats-wrap{padding:16px;}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;transition:background .3s,border-color .3s;}
.chart-title{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:12px;transition:color .3s;}
.mini-chart{display:flex;align-items:flex-end;gap:4px;height:56px;}
.bc{display:flex;flex-direction:column;align-items:center;flex:1;gap:3px;}
.bar{width:100%;border-radius:3px 3px 0 0;min-height:4px;transition:background .3s;}
.blbl{font-family:'DM Mono',monospace;font-size:9px;color:var(--text3);text-align:center;transition:color .3s;}

.card-sec{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px;transition:background .3s,border-color .3s;}
.cs-title{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);padding:12px 14px;border-bottom:1px solid var(--border);transition:color .3s,border-color .3s;}

.sc-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);transition:border-color .3s;}
.sc-row:last-child{border-bottom:none;}
.sc-rk{font-family:'DM Mono',monospace;font-size:14px;color:var(--text3);width:18px;text-align:center;flex-shrink:0;transition:color .3s;}
.sc-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;}
.sc-inf{flex:1;}
.sc-nm{font-size:14px;font-weight:700;margin-bottom:2px;transition:color .3s;}
.sc-tm{font-family:'DM Mono',monospace;font-size:12px;color:var(--text3);transition:color .3s;}
.sc-g{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--accent2);transition:color .3s;}

.elo-row{display:grid;grid-template-columns:24px 1fr 56px 46px;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--border);transition:border-color .3s;}
.elo-row:last-child{border-bottom:none;}
.elo-p{display:flex;align-items:center;gap:8px;}
.elo-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;}
.elo-nm{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s;}
.elo-pts{font-family:'Bebas Neue',sans-serif;font-size:20px;text-align:right;transition:color .3s;}
.elo-d{font-family:'DM Mono',monospace;font-size:14px;text-align:right;}
.du{color:var(--accent);}.dd{color:var(--accent3);}
</style>
</head>
<body>

<header class="header">
  <div class="logo">
    <div class="logo-hex"></div>
    <div class="logo-text">SHYMATC<span>-CHAMP</span></div>
  </div>
  <div class="hdr-right">
    <div class="live-badge"><div class="live-dot"></div>Live</div>
    <button class="theme-btn" id="theme-btn" onclick="toggleTheme()">☀️</button>
  </div>
</header>

<div class="scroll-root" id="scroll-root">

  <!-- HOME -->
  <div class="page active" id="page-home">
    <div id="home-hero-wrap"></div>
    <div class="stats-grid" id="home-stats"></div>
    <div class="events-wrap">
      <div class="section-title">Все события</div>
      <div id="events-list"></div>
    </div>
  </div>

  <!-- STANDINGS -->
  <div class="page" id="page-standings">
    <div class="standings-wrap">
      <div class="section-title">Таблица</div>
      <div class="chip-row" id="standings-chips"></div>
      <div id="standings-content"></div>
    </div>
  </div>

  <!-- MATCHES -->
  <div class="page" id="page-matches">
    <div class="matches-wrap">
      <div class="section-title">Матчи</div>
      <div id="matches-content"></div>
    </div>
  </div>

  <!-- STATS -->
  <div class="page" id="page-stats">
    <div class="stats-wrap">
      <div class="section-title">Статистика</div>
      <div id="stats-content"></div>
      <div style="text-align:center;padding:28px 0 10px;">
        <div style="display:inline-flex;align-items:center;gap:10px;font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;transition:color .3s;">
          <span style="width:24px;height:1px;background:var(--border2);display:inline-block;"></span>
          Created by <span style="color:var(--accent);letter-spacing:2px;transition:color .3s;">&nbsp;DAUREN BOL</span>
          <span style="width:24px;height:1px;background:var(--border2);display:inline-block;"></span>
        </div>
      </div>
    </div>
  </div>

</div>

<nav class="bottom-nav">
  <button class="nav-item active" id="nav-home" onclick="goPage('home')">
    <div class="nav-icon">🏠</div>
    <div class="nav-label">Главная</div>
  </button>
  <button class="nav-item" id="nav-standings" onclick="goPage('standings')">
    <div class="nav-icon">📊</div>
    <div class="nav-label">Таблица</div>
  </button>
  <button class="nav-item" id="nav-matches" onclick="goPage('matches')">
    <div class="nav-icon">⚡</div>
    <div class="nav-label">Матчи</div>
  </button>
  <button class="nav-item" id="nav-stats" onclick="goPage('stats')">
    <div class="nav-icon">📈</div>
    <div class="nav-label">Стат</div>
  </button>
</nav>

<script>
const DATA_URL = "https://daurenbol.github.io/ShymATC-CHAMP/data.json";

const SPORT_ICONS = {
  football:'⚽', efootball:'🎮', chess:'♟', tennis:'🎾',
  basketball:'🏀', ufc:'🥊', business:'💼', education:'🎓', other:'🏆'
};
const VENUE_ICONS = {
  offline:'📍', online:'🌐', playstation:'🎮', pc:'💻',
  xbox:'🎯', mobile:'📱', telegram:'✈️', zoom:'📹', other_venue:'🔧'
};
const TYPE_LABELS = {
  tournament:'Турнир', league:'Лига', championship:'Чемпионат',
  cup:'Кубок', single:'Разовое', meetup:'Встреча',
  training:'Тренировка', registration:'Регистрация', other:'Событие'
};
const COLORS = ['#e8ff47','#47a8ff','#ff6b47','#ffd700','#a78bfa','#34d399','#f87171','#fb923c'];
const BGS = ['rgba(232,255,71,.13)','rgba(71,168,255,.13)','rgba(255,107,71,.13)','rgba(255,215,0,.13)','rgba(167,139,250,.13)','rgba(52,211,153,.13)','rgba(248,113,113,.13)','rgba(251,146,60,.13)'];

let RAW_DATA = null;
let CURRENT_EVENT_ID = null;

function ini(s){ return s.split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase(); }
function medal(i){ return i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1; }

async function loadData() {
  try {
    const r = await fetch(DATA_URL + "?t=" + Date.now());
    RAW_DATA = await r.json();
  } catch(e) {
    console.error("Failed to load:", e);
    RAW_DATA = {events:[], admins:[]};
  }
  renderAll();
}

function calcStandings(event) {
  const st = {};
  event.participants.forEach(p => { st[p] = {name:p,p:0,w:0,d:0,l:0,gf:0,ga:0}; });
  (event.matches||[]).filter(m=>m.played && st[m.home] && st[m.away]).forEach(m => {
    const {home:h, away:a, score_home:sh, score_away:sa} = m;
    [[h,sh,sa],[a,sa,sh]].forEach(([name,gf,ga]) => {
      if(st[name]){st[name].p++;st[name].gf+=gf;st[name].ga+=ga;}
    });
    if(sh>sa){if(st[h])st[h].w++;if(st[a])st[a].l++;}
    else if(sh<sa){if(st[a])st[a].w++;if(st[h])st[h].l++;}
    else{if(st[h])st[h].d++;if(st[a])st[a].d++;}
  });
  return Object.values(st).sort((a,b)=>(b.w*3+b.d)-(a.w*3+a.d)||(b.gf-b.ga)-(a.gf-a.ga));
}

function renderAll() {
  if(!RAW_DATA) return;
  renderHome();
  renderStandings();
  renderMatches();
  renderStats();
}

// ── HOME ──
function renderHome() {
  const events = RAW_DATA.events || [];
  const active = events.filter(e=>e.active);
  const first = active[0];

  // Hero
  const heroWrap = document.getElementById('home-hero-wrap');
  if(first) {
    const mp = (first.matches||[]).filter(m=>m.played).length;
    const icon = SPORT_ICONS[first.category] || '🏆';
    const venue = VENUE_ICONS[first.venue_type] || '📍';
    const typeLabel = TYPE_LABELS[first.event_type] || 'Событие';
    heroWrap.innerHTML = `
    <div class="home-hero">
      <div class="hero-eyebrow">${icon} ${typeLabel}</div>
      <div class="hero-title">${first.name}</div>
      <div class="hero-sub">${venue} ${first.venue_type||''} · ${first.participants.length} участников</div>
      <div class="hero-prog-row">
        <div>
          <div class="prog-lbl">Участников</div>
          <div class="prog-val">${first.participants.length}</div>
          <div class="prog-bar"><div class="prog-fill" style="width:100%;background:var(--accent)"></div></div>
        </div>
        <div>
          <div class="prog-lbl">Матчей</div>
          <div class="prog-val">${mp}</div>
          <div class="prog-bar"><div class="prog-fill" style="width:${mp>0?Math.min(mp*10,100):5}%;background:var(--accent2)"></div></div>
        </div>
        <div>
          <div class="prog-lbl">Событий</div>
          <div class="prog-val">${active.length}</div>
          <div class="prog-bar"><div class="prog-fill" style="width:100%;background:var(--accent3)"></div></div>
        </div>
      </div>
    </div>`;
  } else {
    heroWrap.innerHTML = `<div class="home-hero"><div class="hero-eyebrow">Нет активных событий</div><div class="hero-title">ShymATC-CHAMP</div><div class="hero-sub">Создай первое событие через бота</div></div>`;
  }

  // Stats cards
  const statsEl = document.getElementById('home-stats');
  const totalMatches = events.reduce((s,e)=>{
    const ps = new Set(e.participants||[]);
    return s+(e.matches||[]).filter(m=>m.played && ps.has(m.home) && ps.has(m.away)).length;
  },0);
  // Последний валидный матч
  const lastMatch = (() => {
    if(!first) return null;
    const ps = new Set(first.participants||[]);
    const played = (first.matches||[]).filter(m=>m.played && ps.has(m.home) && ps.has(m.away));
    return played.length ? played[played.length-1] : null;
  })();
  const totalParticipants = [...new Set(events.flatMap(e=>e.participants||[]))].length;
  const lastMatchHtml = lastMatch
    ? `<div class="stat-val" style="font-size:20px;padding-top:2px">${lastMatch.score_home}:${lastMatch.score_away}</div><div class="stat-sub">${lastMatch.home} vs ${lastMatch.away}</div><div style="font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);margin-top:4px">${lastMatch.date||''}</div>`
    : `<div class="stat-val">—</div><div class="stat-sub">нет матчей</div>`;
  statsEl.innerHTML = `
    <div class="stat-card"><div class="stat-lbl">Событий</div><div class="stat-val">${events.length}</div><div class="stat-sub">всего</div></div>
    <div class="stat-card"><div class="stat-lbl">Последний матч</div>${lastMatchHtml}</div>
    <div class="stat-card"><div class="stat-lbl">Матчей</div><div class="stat-val">${totalMatches}</div><div class="stat-sub">сыграно</div></div>
    <div class="stat-card"><div class="stat-lbl">Участников</div><div class="stat-val">${totalParticipants}</div><div class="stat-sub">уникальных</div></div>`;

  // Events list
  const listEl = document.getElementById('events-list');
  if(!events.length) {
    listEl.innerHTML = `<div style="padding:24px;text-align:center;color:var(--text3);font-family:'DM Mono',monospace;font-size:12px;">Событий нет — создай через бота</div>`;
    return;
  }
  listEl.innerHTML = events.map((e,i) => {
    const icon = SPORT_ICONS[e.category] || '🏆';
    const mp = (e.matches||[]).filter(m=>m.played).length;
    const badge = e.active
      ? `<div class="badge badge-live">Live</div>`
      : `<div class="badge badge-done">Done</div>`;
    return `<div class="event-card" style="border-left-color:${COLORS[i%COLORS.length]}" onclick="selectEvent('${e.id}')">
      <div class="ev-icon" style="background:${BGS[i%BGS.length]};font-size:22px;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0">${icon}</div>
      <div class="ev-info">
        <div class="ev-name">${e.name}</div>
        <div class="ev-meta">${e.participants.length} уч. · ${mp} матчей · ${TYPE_LABELS[e.event_type]||''}</div>
      </div>
      <div class="ev-right">${badge}<div class="ev-arrow">›</div></div>
    </div>`;
  }).join('');
}

function selectEvent(id) {
  CURRENT_EVENT_ID = id;
  goPage('standings');
  renderStandings();
}

// ── STANDINGS ──
function renderStandings() {
  const events = (RAW_DATA?.events||[]).filter(e=>e.active);
  const chips = document.getElementById('standings-chips');
  const content = document.getElementById('standings-content');

  if(!events.length) {
    chips.innerHTML = '';
    content.innerHTML = `<div style="padding:40px;text-align:center;color:var(--text3);font-family:'DM Mono',monospace;font-size:12px;">Нет активных событий</div>`;
    return;
  }

  if(!CURRENT_EVENT_ID || !events.find(e=>e.id===CURRENT_EVENT_ID)) {
    CURRENT_EVENT_ID = events[0].id;
  }

  chips.innerHTML = events.map((e,i) => {
    const icon = SPORT_ICONS[e.category] || '🏆';
    const active = e.id === CURRENT_EVENT_ID ? 'active' : '';
    return `<button class="chip ${active}" onclick="selectChip('${e.id}',this)">${icon} ${e.name}</button>`;
  }).join('');

  const ev = events.find(e=>e.id===CURRENT_EVENT_ID) || events[0];
  renderEventTable(ev, content);
}

function selectChip(id, btn) {
  CURRENT_EVENT_ID = id;
  document.querySelectorAll('#standings-chips .chip').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  const ev = (RAW_DATA?.events||[]).find(e=>e.id===id);
  if(ev) renderEventTable(ev, document.getElementById('standings-content'));
}

function renderEventTable(ev, container) {
  const rows = calcStandings(ev);
  if(!rows.length) {
    container.innerHTML = `<div style="padding:32px;text-align:center;color:var(--text3);font-family:'DM Mono',monospace;font-size:12px;">Участников нет</div>`;
    return;
  }
  const rowsHtml = rows.map((r,i) => {
    const pts = r.w*3+r.d;
    const gd = r.gf-r.ga;
    const zc = i<Math.ceil(rows.length/2) ? 'var(--accent)' : i>=rows.length-Math.floor(rows.length/4) ? 'var(--accent3)' : 'transparent';
    const gdCls = gd>=0 ? 'gp' : 'gn';
    const abbr = ini(r.name);
    const c = COLORS[rows.indexOf(r)%COLORS.length];
    const bg = BGS[rows.indexOf(r)%BGS.length];
    return `<div class="t-row col-t">
      <div class="zone-line" style="background:${zc}"></div>
      <div class="rk" style="color:${i<3?c:'var(--text3)'}">${medal(i)}</div>
      <div class="team-c"><div class="t-ava" style="background:${bg};color:${c}">${abbr}</div><div class="t-nm">${r.name}</div></div>
      <div class="cn" style="color:var(--accent)">${r.w}</div>
      <div class="cn">${r.d}</div>
      <div class="cn" style="color:var(--accent3)">${r.l}</div>
      <div class="cn ${gdCls}">${gd>=0?'+'+gd:gd}</div>
      <div class="cp">${pts}</div>
    </div>`;
  }).join('');
  container.innerHTML = `
    <div class="table-card">
      <div class="t-head col-t">
        <div class="th">#</div><div class="th left">Участник</div>
        <div class="th">В</div><div class="th">Н</div><div class="th">П</div>
        <div class="th">±</div><div class="th">Оч</div>
      </div>
      ${rowsHtml}
    </div>
    <div class="legend" style="margin-top:10px">
      <div class="leg-item"><div class="leg-dot" style="background:var(--accent)"></div>Топ</div>
      <div class="leg-item"><div class="leg-dot" style="background:var(--accent3)"></div>Низ</div>
    </div>`;
}

// ── MATCHES ──
function renderMatches() {
  const events = RAW_DATA?.events || [];
  const content = document.getElementById('matches-content');
  const allMatches = [];
  events.forEach(ev => {
    const ps = new Set(ev.participants||[]);
    (ev.matches||[]).filter(m=>m.played && ps.has(m.home) && ps.has(m.away)).forEach(m => allMatches.unshift({...m, eventName: ev.name}));
  });
  if(!allMatches.length) {
    content.innerHTML = `<div style="padding:40px;text-align:center;color:var(--text3);font-family:'DM Mono',monospace;font-size:12px;">Матчей пока нет</div>`;
    return;
  }
  content.innerHTML = `<div class="ms-lbl">🏁 Последние результаты</div>` +
    allMatches.slice(0,10).map(m => {
      const hw=m.score_home>m.score_away, aw=m.score_away>m.score_home;
      return `<div class="match-card">
        <div class="m-date">${m.date||''} · ${m.eventName}</div>
        <div class="m-body">
          <div class="m-team m-home ${hw?'mw':'ml'}">${m.home}</div>
          <div class="m-score">${m.score_home} : ${m.score_away}</div>
          <div class="m-team m-away ${aw?'mw':'ml'}">${m.away}</div>
        </div>
      </div>`;
    }).join('');
}

// ── STATS ──
function renderStats() {
  const events = RAW_DATA?.events || [];
  const content = document.getElementById('stats-content');
  const active = events.filter(e=>e.active);
  if(!active.length) {
    content.innerHTML = `<div style="padding:40px;text-align:center;color:var(--text3);font-family:'DM Mono',monospace;font-size:12px;">Нет данных</div>`;
    return;
  }
  let html = '';
  active.forEach(ev => {
    const rows = calcStandings(ev);
    if(!rows.length) return;
    const goals = (ev.matches||[]).filter(m=>m.played).map(m=>m.score_home+m.score_away);
    const icon = SPORT_ICONS[ev.category]||'🏆';
    // Goals chart
    if(goals.length > 0) {
      const mx = Math.max(...goals, 1);
      html += `<div class="chart-card">
        <div class="chart-title">${icon} ${ev.name} — голы по матчам</div>
        <div class="mini-chart">${goals.map((g,i)=>`
          <div class="bc">
            <div class="bar" style="height:${Math.round(g/mx*48)}px;background:${i===goals.length-1?'var(--accent)':'rgba(120,120,160,.35)'}"></div>
            <div class="blbl">${i+1}</div>
          </div>`).join('')}
        </div>
      </div>`;
    }
    // Top scorers (by wins)
    html += `<div class="card-sec">
      <div class="cs-title">${icon} ${ev.name} — таблица</div>
      <div>${rows.slice(0,5).map((r,i)=>{
        const pts=r.w*3+r.d;
        const c=COLORS[i%COLORS.length], bg=BGS[i%BGS.length];
        return `<div class="sc-row">
          <div class="sc-rk">${medal(i)}</div>
          <div class="sc-av" style="background:${bg};color:${c}">${ini(r.name)}</div>
          <div class="sc-inf"><div class="sc-nm">${r.name}</div><div class="sc-tm">${r.w}П · ${r.d}Н · ${r.l}Пр</div></div>
          <div class="sc-g">${pts}</div>
        </div>`;}).join('')}
      </div>
    </div>`;
  });
  content.innerHTML = html || `<div style="padding:40px;text-align:center;color:var(--text3);">Нет данных</div>`;
}

// ── NAVIGATION ──
const savedTheme = localStorage.getItem('shymatc-theme') || 'dark';
let dark = savedTheme === 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('theme-btn').textContent = dark ? '☀️' : '🌙';
});

function toggleTheme(){
  dark=!dark;
  const theme = dark ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('theme-btn').textContent = dark ? '☀️' : '🌙';
  localStorage.setItem('shymatc-theme', theme);
}

function goPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.getElementById('nav-'+name).classList.add('active');
  document.getElementById('scroll-root').scrollTop=0;
}

loadData();
setInterval(loadData, 60000);
</script>
</body>
</html>
