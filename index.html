<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ShymATC-CHAMP</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
[data-theme="dark"] {
  --bg:#0a0a0f; --surface:#111118; --surface2:#16161f; --surface3:#1c1c28;
  --border:#1e1e2e; --border2:#2a2a3e;
  --accent:#e8ff47; --accent2:#47a8ff; --accent3:#ff6b47;
  --gold:#ffd700; --silver:#a0a0c0; --bronze:#cd7f32;
  --text:#e8e8f0; --text2:#a9a9a9; --text3:#a9a9a9;
  --shadow:rgba(0,0,0,0.6); --glow:rgba(232,255,71,0.07);
  --header-bg:rgba(10,10,15,0.97);
}
[data-theme="light"] {
  --bg:#f0f0f5; --surface:#ffffff; --surface2:#f5f5fa; --surface3:#eaeaf2;
  --border:#dddde8; --border2:#c8c8dc;
  --accent:#1a7a00; --accent2:#0060cc; --accent3:#cc3300;
  --gold:#b8860b; --silver:#6060a0; --bronze:#8b4513;
  --text:#141420; --text2:#50507a; --text3:#9090b8;
  --shadow:rgba(0,0,0,0.1); --glow:rgba(26,122,0,0.04);
  --header-bg:rgba(255,255,255,0.97);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:"Avenir Next","Avenir","Plus Jakarta Sans",sans-serif;transition:background .3s,color .3s;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 40%,var(--glow) 0%,transparent 55%);pointer-events:none;z-index:0;transition:background .3s;}

/* HEADER */
.header{position:fixed;top:0;left:0;right:0;height:56px;background:var(--header-bg);border-bottom:1px solid var(--border);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:100;transition:background .3s,border-color .3s;}
.logo{display:flex;align-items:center;gap:9px;}
.logo-hex{width:28px;height:28px;background:var(--accent);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);animation:hpulse 3s ease-in-out infinite;transition:background .3s;}
@keyframes hpulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}
.logo-text{font-family:'Bebas Neue',sans-serif;font-size:23px;letter-spacing:3px;color:var(--text);transition:color .3s;}
.logo-text span{color:var(--accent);transition:color .3s;}
.hdr-right{display:flex;align-items:center;gap:10px;}
.live-badge{display:flex;align-items:center;gap:5px;font-family:'DM Mono',monospace;font-size:15px;color:var(--accent3);letter-spacing:1px;text-transform:uppercase;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--accent3);animation:blink 1.4s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.theme-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .2s;color:var(--text);}
.theme-btn:active{transform:scale(.92);}

/* TICKER */
.ticker-bar{position:fixed;top:56px;left:0;right:0;height:39px;background:var(--surface);border-bottom:1px solid var(--border);overflow:hidden;display:none;align-items:center;z-index:99;transition:background .3s,border-color .3s;}
.ticker-bar.visible{display:flex;}
.ticker-inner{display:flex;align-items:center;white-space:nowrap;animation:ticker 35s linear infinite;}
@keyframes ticker{0%{transform:translateX(100vw)}100%{transform:translateX(-100%)}}
.ticker-text{font-family:'DM Mono',monospace;font-size:16px;color:var(--accent);letter-spacing:1.5px;}
.ticker-sep{color:var(--text3);margin:0 20px;font-size:14px;}
.ticker-icon{color:var(--accent3);margin-right:10px;font-size:16px;flex-shrink:0;}

/* SCROLL */
.scroll-root{position:fixed;top:56px;left:0;right:0;bottom:60px;overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:1;padding-bottom:8px;}
@supports(padding:max(0px)){
  .bottom-nav{height:calc(60px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);}
  .scroll-root{bottom:calc(60px + env(safe-area-inset-bottom));}
}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:60px;background:var(--header-bg);border-top:1px solid var(--border);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;z-index:100;transition:background .3s,border-color .3s;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border:none;background:transparent;font-family:"Avenir Next","Avenir","Plus Jakarta Sans",sans-serif;color:var(--text3);padding:0;transition:color .2s;}
.nav-item.active{color:var(--accent);}
.nav-icon{font-size:23px;transition:transform .2s;}
.nav-item.active .nav-icon{transform:scale(1.18);}
.nav-label{font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;}

/* PAGE */
.page{display:none;}
.page.active{display:block;}

/* SECTION TITLE */
.section-title{font-family:'Bebas Neue',sans-serif;font-size:21px;letter-spacing:3px;display:flex;align-items:center;gap:8px;margin-bottom:12px;transition:color .3s;}
.section-title::before{content:'';width:3px;height:18px;background:var(--accent);border-radius:2px;flex-shrink:0;transition:background .3s;}

/* ── HOME ── */
.home-hero{margin:16px 16px 0;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;position:relative;overflow:hidden;transition:background .3s,border-color .3s;}
.home-hero::after{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;background:radial-gradient(circle,var(--glow) 0%,transparent 70%);pointer-events:none;}
.hero-eyebrow{font-family:'DM Mono',monospace;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:6px;transition:color .3s;}
.hero-title{font-family:"Avenir Next","Avenir","Plus Jakarta Sans",sans-serif;font-weight:800;font-size:30px;letter-spacing:0px;margin-bottom:4px;transition:color .3s;}
.hero-sub{font-family:'DM Mono',monospace;font-size:16px;color:var(--text2);margin-bottom:16px;transition:color .3s;}
.hero-prog-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.prog-lbl{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:4px;transition:color .3s;}
.prog-val{font-family:'Bebas Neue',sans-serif;font-size:21px;margin-bottom:3px;transition:color .3s;}
.prog-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden;transition:background .3s;}
.prog-fill{height:100%;border-radius:2px;transition:width 1s ease;}

.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px 16px 0;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;position:relative;overflow:hidden;transition:background .3s,border-color .3s;}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.stat-card:nth-child(1)::before{background:var(--accent);}
.stat-card:nth-child(2)::before{background:var(--accent2);}
.stat-card:nth-child(3)::before{background:var(--accent3);}
.stat-card:nth-child(4)::before{background:var(--gold);}
.stat-lbl{font-family:'DM Mono',monospace;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:6px;transition:color .3s;}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:41px;line-height:1;margin-bottom:3px;transition:color .3s;}
.stat-card:nth-child(1) .stat-val{color:var(--accent);}
.stat-card:nth-child(2) .stat-val{color:var(--accent2);}
.stat-card:nth-child(3) .stat-val{color:var(--accent3);}
.stat-card:nth-child(4) .stat-val{color:var(--gold);}
.stat-sub{font-size:16px;color:var(--text2);transition:color .3s;}

.events-wrap{padding:16px;}
.event-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.event-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:0 2px 2px 0;}
.event-card.type-football::before{background:var(--accent);}
.event-card.type-chess::before{background:var(--accent2);}
.event-card.type-tennis::before{background:var(--accent3);}
.event-card:active{transform:scale(.98);background:var(--surface2);}
.ev-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:25px;flex-shrink:0;transition:background .3s;}
.ev-icon.football{background:rgba(232,255,71,.1);}
.ev-icon.chess{background:rgba(71,168,255,.1);}
.ev-icon.tennis{background:rgba(255,107,71,.1);}
[data-theme="light"] .ev-icon.football{background:rgba(26,122,0,.1);}
[data-theme="light"] .ev-icon.chess{background:rgba(0,96,204,.1);}
[data-theme="light"] .ev-icon.tennis{background:rgba(204,51,0,.1);}
.ev-info{flex:1;min-width:0;}
.ev-name{font-size:16px;font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s;}
.ev-meta{font-family:'DM Mono',monospace;font-size:15px;color:var(--text3);transition:color .3s;}
.ev-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;}
.badge{font-family:'DM Mono',monospace;font-size:14px;padding:3px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:1px;}
.badge-live{background:rgba(232,255,71,.12);color:var(--accent);border:1px solid rgba(232,255,71,.25);}
.badge-done{background:var(--surface2);color:var(--text2);border:1px solid var(--border);}
[data-theme="light"] .badge-live{background:rgba(26,122,0,.1);color:var(--accent);border-color:rgba(26,122,0,.3);}
.ev-arrow{font-size:18px;color:var(--text3);}

/* ── STANDINGS ── */
.standings-wrap{padding:16px;}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .2s;color:var(--text2);font-family:"Avenir Next","Avenir","Plus Jakarta Sans",sans-serif;}
.chip.active{background:var(--accent);border-color:var(--accent);color:#0a0a0f;}
[data-theme="light"] .chip.active{color:#fff;}
.chip.group-chip{border-color:var(--gold);}
.chip.group-chip.active{background:var(--gold);border-color:var(--gold);color:#0a0a0f;}
[data-theme="light"] .chip.group-chip.active{color:#0a0a0f;}

/* Group standings — 3 columns */
.group-tables{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.group-table-col{}
.group-col-title{font-family:'DM Mono',monospace;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:8px;padding:0 2px;transition:color .3s;}
.group-col-title.overall{color:var(--gold);}
@media(max-width:600px){.group-tables{grid-template-columns:1fr;}}

.table-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:background .3s,border-color .3s;}
.t-head{display:grid;padding:10px 12px;border-bottom:1px solid var(--border);transition:border-color .3s;}
.col-t{grid-template-columns:28px 1fr 26px 26px 26px 26px 30px 30px 28px 36px;}
.col-i{grid-template-columns:24px 1fr 30px 22px 22px 22px 46px;}
.th{font-family:'DM Mono',monospace;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);text-align:center;transition:color .3s;}
.th.left{text-align:left;}

.t-row{display:grid;padding:11px 12px;border-bottom:1px solid var(--border);align-items:center;position:relative;transition:background .15s,border-color .3s;animation:rin .35s ease forwards;opacity:0;transform:translateX(-8px);}
.t-row:last-child{border-bottom:none;}
.t-row:active{background:var(--surface2);}
@keyframes rin{to{opacity:1;transform:translateX(0)}}
.t-row:nth-child(1){animation-delay:.04s}.t-row:nth-child(2){animation-delay:.08s}.t-row:nth-child(3){animation-delay:.12s}.t-row:nth-child(4){animation-delay:.16s}.t-row:nth-child(5){animation-delay:.20s}.t-row:nth-child(6){animation-delay:.24s}.t-row:nth-child(7){animation-delay:.28s}.t-row:nth-child(8){animation-delay:.32s}
.zone-line{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:0 2px 2px 0;}
.rk{font-family:'DM Mono',monospace;font-size:16px;color:var(--text3);text-align:center;transition:color .3s;}
.team-c{display:flex;align-items:center;gap:8px;}
.t-ava{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;}
.t-nm{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s;}
.cn{font-family:'DM Mono',monospace;font-size:16px;color:var(--text2);text-align:center;transition:color .3s;}
.cp{font-family:'Bebas Neue',sans-serif;font-size:23px;text-align:center;color:var(--text);transition:color .3s;}
.gp{color:var(--accent)!important;}.gn{color:var(--accent3)!important;}
.frow{display:flex;gap:2px;justify-content:center;}
.fd{width:14px;height:14px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;font-family:'DM Mono',monospace;}
.fw{background:rgba(232,255,71,.18);color:var(--accent);}
.fdraw{background:rgba(120,120,160,.2);color:var(--text2);}
.fl{background:rgba(255,107,71,.15);color:var(--accent3);}
[data-theme="light"] .fw{background:rgba(26,122,0,.15);color:var(--accent);}
[data-theme="light"] .fdraw{background:rgba(80,80,122,.15);color:var(--text2);}
[data-theme="light"] .fl{background:rgba(204,51,0,.12);color:var(--accent3);}

.legend{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap;}
.leg-item{display:flex;align-items:center;gap:5px;font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);transition:color .3s;}
.leg-dot{width:8px;height:8px;border-radius:2px;}

/* ── MATCHES ── */
.matches-wrap{padding:16px;}
.ms-lbl{font-family:'DM Mono',monospace;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);padding:6px 0 10px;transition:color .3s;}
.match-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;transition:background .3s,border-color .3s;}
.m-date{font-family:'DM Mono',monospace;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:12px;transition:color .3s;}
.m-body{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;}
.m-team{font-size:15px;font-weight:700;transition:color .3s;}
.m-home{text-align:right;}.m-away{text-align:left;}
.m-score{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:2px;text-align:center;color:var(--accent);background:rgba(232,255,71,.08);border-radius:8px;padding:3px 10px;min-width:64px;transition:background .3s,color .3s;}
[data-theme="light"] .m-score{background:rgba(26,122,0,.06);}
.mw{color:var(--accent);}.ml{color:var(--text3);}

.upc-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent2);border-radius:14px;padding:14px;margin-bottom:10px;transition:background .3s,border-color .3s;}
.upc-time{font-family:'DM Mono',monospace;font-size:15px;color:var(--accent2);margin-bottom:8px;transition:color .3s;}
.upc-teams{display:grid;grid-template-columns:1fr 32px 1fr;align-items:center;gap:6px;}
.upc-team{font-size:14px;font-weight:700;transition:color .3s;}
.upc-h{text-align:right;}.upc-a{text-align:left;}
.vs-b{font-family:'DM Mono',monospace;font-size:10px;border:1px solid var(--border2);border-radius:4px;padding:2px 4px;text-align:center;color:var(--text3);transition:all .3s;}


/* ── PLAYER PROFILE ── */
.pl-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);background:var(--surface);margin-bottom:0;}
.pl-tab{flex:1;padding:10px;text-align:center;font-family:'DM Mono',monospace;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;color:var(--text3);border:none;background:none;border-bottom:2px solid transparent;transition:all .2s;}
.pl-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.pl-tab-content{display:none;}
.pl-tab-content.active{display:block;}
.pl-pending-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;transition:background .3s,border-color .3s;}
.pl-pending-opp{font-size:16px;font-weight:700;transition:color .3s;}
.pl-pending-badge{font-family:'DM Mono',monospace;font-size:10px;padding:3px 8px;border-radius:4px;background:var(--surface2);color:var(--text3);border:1px solid var(--border);letter-spacing:1px;}

.player-profile-page{padding:0;}
.player-hdr{position:sticky;top:0;height:50px;background:var(--header-bg);border-bottom:1px solid var(--border);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:10;transition:background .3s,border-color .3s;}
.player-back{background:none;border:none;color:var(--accent);font-size:25px;cursor:pointer;padding:4px 8px 4px 0;line-height:1;}
.player-hdr-title{font-family:'DM Mono',monospace;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);transition:color .3s;}
.player-hero{background:var(--surface);border-bottom:1px solid var(--border);padding:20px 16px 16px;transition:background .3s,border-color .3s;}
.player-ava-wrap{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
.player-ava-lg{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:800;flex-shrink:0;}
.player-info{flex:1;}
.player-nm{font-size:25px;font-weight:800;margin-bottom:3px;transition:color .3s;}
.player-ev{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;transition:color .3s;}
.pl-stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px;}
.pl-stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.pl-sc{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 6px;text-align:center;position:relative;overflow:hidden;transition:background .3s,border-color .3s;}
.pl-sv{font-family:'Bebas Neue',sans-serif;font-size:25px;line-height:1;}
.pl-sl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text3);margin-top:2px;transition:color .3s;}
.pl-matches-wrap{padding:14px 16px;}
.pl-sec-title{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:10px;transition:color .3s;}
.pl-match{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;transition:background .3s,border-color .3s;}
.pl-match-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.pl-match-date{font-family:'DM Mono',monospace;font-size:12px;color:var(--text3);letter-spacing:1px;transition:color .3s;}
.pl-match-res{font-family:'DM Mono',monospace;font-size:12px;padding:2px 8px;border-radius:4px;font-weight:700;letter-spacing:1px;}
.pl-win{background:rgba(232,255,71,.1);color:var(--accent);border:1px solid rgba(232,255,71,.2);}
.pl-draw{background:var(--surface2);color:var(--text2);border:1px solid var(--border);}
.pl-lose{background:rgba(255,107,71,.1);color:var(--accent3);border:1px solid rgba(255,107,71,.2);}
[data-theme="light"] .pl-win{background:rgba(26,122,0,.08);color:var(--accent);border-color:rgba(26,122,0,.2);}
[data-theme="light"] .pl-lose{background:rgba(204,51,0,.08);color:var(--accent3);border-color:rgba(204,51,0,.2);}
.pl-match-body{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;}
.pl-match-team{font-size:15px;font-weight:700;transition:color .3s;}
.pl-match-you{color:var(--accent);}
.pl-mh{text-align:right;}.pl-ma{text-align:left;}
.pl-match-score{font-family:'Bebas Neue',sans-serif;font-size:25px;text-align:center;border-radius:8px;padding:3px 10px;min-width:58px;transition:background .3s,color .3s;}
.pl-score-win{color:var(--accent);background:rgba(232,255,71,.08);}
.pl-score-draw{color:var(--text2);background:var(--surface2);}
.pl-score-lose{color:var(--accent3);background:rgba(255,107,71,.08);}
[data-theme="light"] .pl-score-win{background:rgba(26,122,0,.06);}
[data-theme="light"] .pl-score-lose{background:rgba(204,51,0,.06);}
/* ── STATS ── */
.stats-wrap{padding:16px;}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;transition:background .3s,border-color .3s;}
.chart-title{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:12px;transition:color .3s;}

/* CHART: scrollable wrapper */
.mini-chart-wrap{
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  border-radius:6px;
}
.mini-chart-wrap::-webkit-scrollbar{display:none;}
.mini-chart{
  display:flex;
  align-items:flex-end;
  gap:4px;
  height:68px;
  min-width:max-content;
  padding:4px 2px 0;
}

.bc{display:flex;flex-direction:column;align-items:center;gap:3px;}
.bar{width:18px;border-radius:3px 3px 0 0;min-height:4px;transition:background .3s;}
.blbl{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);text-align:center;width:18px;transition:color .3s;}

.prog-block{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px;transition:background .3s,border-color .3s;}
.pb-nums{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:14px 14px 10px;}
.pb-n{text-align:center;}
.pb-val{font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:1;}
.pb-lbl{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--text3);margin-top:2px;}
.pb-bar-outer{height:6px;background:var(--border);margin:0 14px 8px;border-radius:4px;overflow:hidden;}
.pb-bar-inner{height:100%;border-radius:4px;background:var(--accent2);transition:width .8s ease;}
.pb-footer{display:flex;justify-content:space-between;padding:0 14px 12px;}
.pb-pct{font-family:'DM Mono',monospace;font-size:13px;color:var(--accent2);font-weight:700;}
.pb-sub{font-family:'DM Mono',monospace;font-size:12px;color:var(--text3);}
.pb-toggle{width:100%;background:none;border:none;border-top:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;color:var(--text3);font-family:'DM Mono',monospace;font-size:12px;letter-spacing:1px;text-transform:uppercase;transition:background .15s;}
.pb-toggle:active{background:var(--surface2);}
.pb-toggle-arr{color:var(--accent);font-size:12px;transition:transform .2s;}
.pb-toggle-arr.open{transform:rotate(180deg);}
.pb-pairs{border-top:1px solid var(--border);}
.pb-pair{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--border2);}
.pb-pair:last-child{border-bottom:none;}
.pb-pair-names{font-size:14px;font-weight:600;color:var(--text);}
.pb-pair-sep{color:var(--text3);margin:0 6px;}
.pb-pair-badge{font-family:'DM Mono',monospace;font-size:10px;padding:2px 6px;border-radius:3px;background:rgba(255,107,71,.12);color:var(--accent3);border:1px solid rgba(255,107,71,.2);}
.card-sec{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px;transition:background .3s,border-color .3s;}
.cs-title{font-family:'DM Mono',monospace;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);padding:12px 14px;border-bottom:1px solid var(--border);transition:color .3s,border-color .3s;}

.sc-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);transition:border-color .3s;}
.sc-row:last-child{border-bottom:none;}
.sc-rk{font-family:'DM Mono',monospace;font-size:16px;color:var(--text3);width:18px;text-align:center;flex-shrink:0;transition:color .3s;}
.sc-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;}
.sc-inf{flex:1;}
.sc-nm{font-size:16px;font-weight:700;margin-bottom:2px;transition:color .3s;}
.sc-tm{font-family:'DM Mono',monospace;font-size:14px;color:var(--text3);transition:color .3s;}
.sc-g{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--accent2);transition:color .3s;}

.elo-row{display:grid;grid-template-columns:24px 1fr 56px 46px;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--border);transition:border-color .3s;}
.elo-row:last-child{border-bottom:none;}
.elo-p{display:flex;align-items:center;gap:8px;}
.elo-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;}
.elo-nm{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s;}
.elo-pts{font-family:'Bebas Neue',sans-serif;font-size:23px;text-align:right;transition:color .3s;}
.elo-d{font-family:'DM Mono',monospace;font-size:16px;text-align:right;}
.du{color:var(--accent);}.dd{color:var(--accent3);}
</style>
</head>
<body>

  </div>

<div class="ticker-bar" id="ticker-bar">

<script>
const DATA_URL = "https://daurenbol.github.io/ShymATC-CHAMP/data.json";

const SPORT_ICONS = {
  football:'⚽', efootball:'🎮', chess:'♟', tennis:'🎾',
  basketball:'🏀', ufc:'🥊', business:'💼', education:'🎓', other:'🏆'
};
const VENUE_ICONS = {
  offline:'📍', online:'🌐', playstation:'🎮', pc:'💻',
  xbox:'🎯', mobile:'📱', telegram:'✈️', zoom:'📹', other_venue:'🔧'
};
const TYPE_LABELS = {
  tournament:'Турнир', league:'Лига', championship:'Чемпионат',
  cup:'Кубок', single:'Разовое', meetup:'Встреча',
  training:'Тренировка', registration:'Регистрация', other:'Событие'
};
const COLORS = ['#e8ff47','#47a8ff','#ff6b47','#ffd700','#a78bfa','#34d399','#f87171','#fb923c'];
const BGS = ['rgba(232,255,71,.13)','rgba(71,168,255,.13)','rgba(255,107,71,.13)','rgba(255,215,0,.13)','rgba(167,139,250,.13)','rgba(52,211,153,.13)','rgba(248,113,113,.13)','rgba(251,146,60,.13)'];

let RAW_DATA = null;
let CURRENT_EVENT_ID = null;

function ini(s){ return s.split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase(); }
function medal(i){ return i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1; }

async function loadData() {
  try {
    const r = await fetch(DATA_URL + "?t=" + Date.now());
    RAW_DATA = await r.json();
  } catch(e) {
    console.error("Failed to load:", e);
    RAW_DATA = {events:[], admins:[]};
  }
  renderAll();
}

function calcStandings(event) {
  const st = {};
  event.participants.forEach(p => { st[p] = {name:p,p:0,w:0,d:0,l:0,gf:0,ga:0}; });
  (event.matches||[]).filter(m=>m.played && st[m.home] && st[m.away]).forEach(m => {
    const {home:h, away:a, score_home:sh, score_away:sa} = m;
    [[h,sh,sa],[a,sa,sh]].forEach(([name,gf,ga]) => {
      if(st[name]){st[name].p++;st[name].gf+=gf;st[name].ga+=ga;}
    });
    if(sh>sa){if(st[h])st[h].w++;if(st[a])st[a].l++;}
    else if(sh<sa){if(st[a])st[a].w++;if(st[h])st[h].l++;}
    else{if(st[h])st[h].d++;if(st[a])st[a].d++;}
  });
  return Object.values(st).sort((a,b)=>(b.w*3+b.d)-(a.w*3+a.d)||(b.gf-b.ga)-(a.gf-a.ga));
}

function openPlayer(playerName, eventId) {
  const ev = (RAW_DATA?.events||[]).find(e=>e.id===eventId);
  if(!ev) return;
  const ps = new Set(ev.participants||[]);
  const rows = calcStandings(ev);
  const r = rows.find(x=>x.name===playerName);
  if(!r) return;
  const pts = r.w*3+r.d;
  const gd = r.gf-r.ga;
  const gdCls = gd>=0?'color:var(--accent)':'color:var(--accent3)';
  const abbr = ini(playerName);
  const colorIdx = rows.indexOf(r)%COLORS.length;
  const c = COLORS[colorIdx], bg = BGS[colorIdx];
  const icon = SPORT_ICONS[ev.category]||'🏆';

  // Player matches
  const matches = (ev.matches||[]).filter(m=>m.played && ps.has(m.home) && ps.has(m.away) && (m.home===playerName||m.away===playerName));
  const matchesHtml = matches.slice().reverse().map(m=>{
    const isHome = m.home===playerName;
    const myScore = isHome?m.score_home:m.score_away;
    const oppScore = isHome?m.score_away:m.score_home;
    const opp = isHome?m.away:m.home;
    const win = myScore>oppScore, draw = myScore===oppScore;
    const resLbl = win?'ПОБЕДА':draw?'НИЧЬЯ':'ПОРАЖ.';
    const resCls = win?'pl-win':draw?'pl-draw':'pl-lose';
    const scoreCls = win?'pl-score-win':draw?'pl-score-draw':'pl-score-lose';
    const scoreHtml = isHome
      ? `<span style="color:var(--accent)">${m.score_home}</span>:<span>${m.score_away}</span>`
      : `<span>${m.score_home}</span>:<span style="color:var(--accent)">${m.score_away}</span>`;
    const homeYou = isHome;
    return `<div class="pl-match">
      <div class="pl-match-top">
        <div class="pl-match-date">${m.date||''}</div>
        <div class="pl-match-res ${resCls}">${resLbl}</div>
      </div>
      <div class="pl-match-body">
        <div class="pl-match-team pl-mh ${homeYou?'pl-match-you':''}">${m.home}</div>
        <div class="pl-match-score ${scoreCls}">${m.score_home}:${m.score_away}</div>
        <div class="pl-match-team pl-ma ${!homeYou?'pl-match-you':''}">${m.away}</div>
      </div>
    </div>`;
  }).join('');

  const _playedSetForTab = new Set();
  (ev.matches||[]).filter(m=>m.played && ps.has(m.home) && ps.has(m.away)).forEach(m=>{
    const key = [m.home,m.away].sort().join('|||');
    _playedSetForTab.add(key);
  });
  const pendingCount = ev.participants.filter(p=>p!==playerName && !_playedSetForTab.has([playerName,p].sort().join('|||'))).length;
  const playerTeam = (ev.participant_teams && ev.participant_teams[playerName]) ? ev.participant_teams[playerName] : 'не определено';

  document.getElementById('player-content').innerHTML = `
    <div class="player-hero">
      <div class="player-ava-wrap">
        <div class="player-ava-lg" style="background:${bg};color:${c}">${abbr}</div>
        <div class="player-info">
          <div class="player-nm">${playerName}</div>
          <div class="player-ev">${icon} ${ev.name}</div>
          <div style="font-family:'DM Mono',monospace;font-size:11px;color:var(--accent2);margin-top:4px;letter-spacing:1px;">🎮 ${playerTeam}</div>
        </div>
      </div>
      <div class="pl-stats4">
        <div class="pl-sc" style="border-top:2px solid var(--accent)"><div class="pl-sv" style="color:var(--accent)">${pts}</div><div class="pl-sl">Очки</div></div>
        <div class="pl-sc" style="border-top:2px solid var(--accent2)"><div class="pl-sv" style="color:var(--accent2)">${r.gf}</div><div class="pl-sl">Голы</div></div>
        <div class="pl-sc" style="border-top:2px solid var(--accent3)"><div class="pl-sv" style="color:var(--accent3)">${r.ga}</div><div class="pl-sl">Проп.</div></div>
        <div class="pl-sc" style="border-top:2px solid var(--gold)"><div class="pl-sv" style="color:var(--gold)">${r.p}</div><div class="pl-sl">Матчи</div></div>
      </div>
      <div class="pl-stats3">
        <div class="pl-sc" style="border-top:2px solid var(--accent)"><div class="pl-sv" style="color:var(--accent);font-size:20px">${r.w}</div><div class="pl-sl">Победы</div></div>
        <div class="pl-sc" style="border-top:2px solid var(--text2)"><div class="pl-sv" style="color:var(--text2);font-size:20px">${r.d}</div><div class="pl-sl">Ничьи</div></div>
        <div class="pl-sc" style="border-top:2px solid var(--accent3)"><div class="pl-sv" style="color:var(--accent3);font-size:20px">${r.l}</div><div class="pl-sl">Пораж.</div></div>
      </div>
    </div>
    <div class="pl-tabs">
      <button class="pl-tab active" onclick="plTab('played','${ev.id}','${playerName}',this)">Сыграно (${matches.length})</button>
      <button class="pl-tab" onclick="plTab('pending','${ev.id}','${playerName}',this)">Не сыграли (${pendingCount})</button>
    </div>
    <div class="pl-matches-wrap">
      <div id="pl-played-${ev.id}" class="pl-tab-content active">
        ${matchesHtml || '<div style="padding:20px;text-align:center;color:var(--text3);font-family:monospace;font-size:12px;">Матчей нет</div>'}
      </div>
      <div id="pl-pending-${ev.id}" class="pl-tab-content">
        <div id="pl-pending-list-${ev.id}"></div>
      </div>
    </div>`;

  // Show player page
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-player').classList.add('active');
  document.getElementById('scroll-root').scrollTop=0;
}

function closePlayer() {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-standings').classList.add('active');
  document.getElementById('scroll-root').scrollTop=0;
}

function plTab(type, evId, playerName, btn) {
  // Switch tabs
  btn.closest('.pl-tabs').querySelectorAll('.pl-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('pl-played-'+evId).classList.toggle('active', type==='played');
  document.getElementById('pl-pending-'+evId).classList.toggle('active', type==='pending');

  if(type==='pending') {
    const ev = (RAW_DATA?.events||[]).find(e=>e.id===evId);
    if(!ev) return;
    const ps = new Set(ev.participants||[]);
    const playedSet = new Set();
    (ev.matches||[]).filter(m=>m.played && ps.has(m.home) && ps.has(m.away)).forEach(m=>{
      const key = [m.home,m.away].sort().join('|||');
      playedSet.add(key);
    });
    const pending = ev.participants.filter(p=>p!==playerName).filter(p=>{
      const key = [playerName,p].sort().join('|||');
      return !playedSet.has(key);
    });
    const container = document.getElementById('pl-pending-list-'+evId);
    if(!pending.length) {
      container.innerHTML = '<div style="padding:24px;text-align:center;color:var(--text3);font-family:monospace;font-size:12px;">✅ Сыграл со всеми!</div>';
      return;
    }
    container.innerHTML = pending.map(opp=>`
      <div class="pl-pending-item">
        <div class="pl-pending-opp">${opp}</div>
        <div class="pl-pending-badge">не играли</div>
      </div>`).join('');
  }
}

function togglePairs(listId, arrId) {
  const list = document.getElementById(listId);
  const arr = document.getElementById(arrId);
  if(!list) return;
  const open = list.style.display === 'block';
  list.style.display = open ? 'none' : 'block';
  if(arr) arr.classList.toggle('open', !open);
}

function renderAll() {
  if(!RAW_DATA) return;
  renderTicker();
  renderHome();
  renderStandings();
  renderMatches();
  renderStats();
}

function getTickerText() {
  const mode = RAW_DATA?.ticker_mode || '';
  const events = RAW_DATA?.events || [];
  const active = events.filter(e=>e.active);
  const ev = active[0];
  // Обратная совместимость: старый формат без ticker_mode
  if(!mode && RAW_DATA?.ticker) return RAW_DATA.ticker;
  if(mode === 'custom') return RAW_DATA?.ticker || '';
  if(!ev) return '';
  const ps = new Set(ev.participants||[]);
  const played = (ev.matches||[]).filter(m=>m.played && ps.has(m.home) && ps.has(m.away));
  if(mode === 'last_match') {
    if(!played.length) return '';
    const last = played[played.length-1];
    const res = last.score_home > last.score_away ? `${last.home.toUpperCase()} ПОБЕДИЛ` : last.score_away > last.score_home ? `${last.away.toUpperCase()} ПОБЕДИЛ` : 'НИЧЬЯ';
    return `⚽ ПОСЛЕДНИЙ МАТЧ: ${last.home.toUpperCase()} ${last.score_home}:${last.score_away} ${last.away.toUpperCase()} — ${res}`;
  }
  if(mode === 'leader') {
    const rows = calcStandings(ev);
    if(!rows.length) return '';
    const leader = rows[0];
    const pts = leader.w*3+leader.d;
    return `🏆 ЛИДЕР ТУРНИРА ${ev.name.toUpperCase()}: ${leader.name.toUpperCase()} — ${pts} ОЧКОВ!`;
  }
  if(mode === 'top_scorer') {
    const rows = calcStandings(ev);
    if(!rows.length) return '';
    const top = rows.reduce((b,r)=>r.gf>b.gf?r:b);
    return `🎯 ЛУЧШИЙ БОМБАРДИР: ${top.name.toUpperCase()} — ${top.gf} ГОЛОВ В ${ev.name.toUpperCase()}`;
  }
  if(mode === 'top_match') {
    if(!played.length) return '';
    const top = played.reduce((b,m)=>(m.score_home+m.score_away)>(b.score_home+b.score_away)?m:b);
    return `🔥 САМЫЙ РЕЗУЛЬТАТИВНЫЙ: ${top.home.toUpperCase()} ${top.score_home}:${top.score_away} ${top.away.toUpperCase()} — ${top.score_home+top.score_away} ГОЛОВ!`;
  }
  if(mode === 'dirty') {
    const dirty = ev.dirty_player;
    if(!dirty) return '';
    return `😈 САМЫЙ ГРЯЗНЫЙ ИГРОК ПО МНЕНИЮ УЧАСТНИКОВ: ${dirty.toUpperCase()}`;
  }
  return '';
}

function selectChip(id, btn) {

function calcGroupStandings(eventIds) {
  // Merge all matches from all events in group, participants = union
  const events = (RAW_DATA?.events||[]).filter(e=>eventIds.includes(e.id));
  const allParticipants = [...new Set(events.flatMap(e=>e.participants||[]))];
  const st = {};
  allParticipants.forEach(p => { st[p]={name:p,p:0,w:0,d:0,l:0,gf:0,ga:0}; });
  events.forEach(ev => {
    const ps = new Set(ev.participants||[]);
    (ev.matches||[]).forEach(m => {
      if(!m.played || !ps.has(m.home) || !ps.has(m.away)) return;
      const {home:h,away:a,score_home:sh,score_away:sa} = m;
      if(st[h]){st[h].p++;st[h].gf+=sh;st[h].ga+=sa;}
      if(st[a]){st[a].p++;st[a].gf+=sa;st[a].ga+=sh;}
      if(sh>sa){if(st[h])st[h].w++;if(st[a])st[a].l++;}
      else if(sh<sa){if(st[a])st[a].w++;if(st[h])st[h].l++;}
      else{if(st[h])st[h].d++;if(st[a])st[a].d++;}
    });
  });
  return Object.values(st).sort((a,b)=>(b.w*3+b.d)-(a.w*3+a.d)||(b.gf-b.ga)-(a.gf-a.ga));
}

function renderStatBlock(ev, ps, label) {
  const rows = calcStandings(ev) || [];
  const icon = SPORT_ICONS[ev.category]||'🏆';
  const goalsRaw = (ev.matches||[]).filter(m=>m.played && ps.has(m.home) && ps.has(m.away)).map(m=>m.score_home+m.score_away);
  const goals = goalsRaw.slice().reverse();
  let html = '';
  if(goals.length > 0) {
    const mx = Math.max(...goals, 1);
    const chartId = 'chart-'+ev.id+'-'+Math.random().toString(36).slice(2);
    html += `<div class="chart-card">
      <div class="chart-title">${label||ev.name} — голы по матчам (${goals.length})</div>
      <div class="mini-chart-wrap" id="${chartId}">
        <div class="mini-chart">${goals.map((g,i)=>`
          <div class="bc">
            <div class="bar" style="height:${Math.round(g/mx*48)}px;background:${i===0?'var(--accent)':'rgba(120,120,160,.35)'}"></div>
            <div class="blbl">${goals.length-i}</div>
          </div>`).join('')}
        </div>
      </div>
    </div>`;
  }
  const n = ev.participants.length;
  const totalPairs = Math.round(n*(n-1)/2);
  if(totalPairs > 0) {
    const playedMatches = (ev.matches||[]).filter(m=>m.played && ps.has(m.home) && ps.has(m.away));
    const playedPairsSet = new Set();
    playedMatches.forEach(m=>{ playedPairsSet.add([m.home,m.away].sort().join('|||')); });
    const playedPairs = playedPairsSet.size;
    const remainingPairs = totalPairs - playedPairs;
    const pct = Math.round(playedPairs/totalPairs*100);
    const unplayed = [];
    for(let i=0;i<ev.participants.length;i++)
      for(let j=i+1;j<ev.participants.length;j++){
        const key=[ev.participants[i],ev.participants[j]].sort().join('|||');
        if(!playedPairsSet.has(key)) unplayed.push([ev.participants[i],ev.participants[j]]);
      }
    const completedPlayers = ev.participants.filter(p=>ev.participants.filter(o=>o!==p).every(o=>playedPairsSet.has([p,o].sort().join('|||'))));
    const uid = ev.id+'-'+Math.random().toString(36).slice(2);
    const pairsListId='pairs-list-'+uid, pairsArrId='pairs-arr-'+uid;

    html += `<div class="prog-block">
      <div class="pb-nums">
        <div class="pb-n"><div class="pb-val" style="color:var(--accent2)">${playedPairs}</div><div class="pb-lbl">сыграли</div></div>
        <div class="pb-n"><div class="pb-val" style="color:var(--accent3)">${remainingPairs}</div><div class="pb-lbl">осталось</div></div>
        <div class="pb-n"><div class="pb-val" style="color:var(--text3)">${totalPairs}</div><div class="pb-lbl">всего пар</div></div>
      </div>
      <div class="pb-bar-outer"><div class="pb-bar-inner" style="width:${pct}%"></div></div>
      <div class="pb-footer"><div class="pb-pct">${pct}% пар сыграли</div><div class="pb-sub">${n} участников</div></div>
      ${remainingPairs>0?`<button class="pb-toggle" onclick="togglePairs('${pairsListId}','${pairsArrId}')"><span>${remainingPairs} ${remainingPairs===1?'пара':remainingPairs<5?'пары':'пар'} ещё не встречались</span><span class="pb-toggle-arr" id="${pairsArrId}">▼</span></button><div class="pb-pairs" id="${pairsListId}" style="display:none">${unplayedHtml}</div>`:`<div style="padding:10px 14px;font-family:'DM Mono',monospace;font-size:10px;color:var(--accent)">✅ Все пары сыграли!</div>`}
    </div>`;
  }
  if(rows.length) {
    html += `<div class="card-sec">
      <div class="cs-title">${label||ev.name} — таблица</div>
      <div>${rows.slice(0,5).map((r,i)=>{
        const pts=r.w*3+r.d;
        const c=COLORS[i%COLORS.length], bg=BGS[i%BGS.length];
        const done = ev.participants.filter(o=>o!==r.name).every(o=>new Set(
          (ev.matches||[]).filter(m=>m.played&&ps.has(m.home)&&ps.has(m.away)).map(m=>[m.home,m.away].sort().join('|||'))
        ).has([r.name,o].sort().join('|||')));
        return `<div class="sc-row">
          <div class="sc-rk">${medal(i)}</div>
          <div class="sc-av" style="background:${bg};color:${c}">${ini(r.name)}</div>
          <div class="sc-inf"><div class="sc-nm">${r.name}${done?' <span style="font-size:10px">✅</span>':''}</div><div class="sc-tm">${r.w}П · ${r.d}Н · ${r.l}Пр</div></div>
          <div class="sc-g">${pts}</div>
        </div>`;}).join('')}
      </div>
    </div>`;
  }
  return html;
}

function renderStats() {
  const events = RAW_DATA?.events || [];
  const groups = activeGroups();
  const content = document.getElementById('stats-content');
  const active = events.filter(e=>e.active);
  if(!active.length) {
    content.innerHTML = `<div style="padding:40px;text-align:center;color:var(--text3);font-family:'DM Mono',monospace;font-size:12px;">Нет данных</div>`;
    return;
  }
  let html = '';

  // Группы — общая статистика сверху
  groups.forEach(group => {
    const groupEvents = events.filter(e=>group.event_ids.includes(e.id));
    if(!groupEvents.length) return;
    // Создаём виртуальное событие из всех матчей группы
    const allParticipants = [...new Set(groupEvents.flatMap(e=>e.participants||[]))];
    const allMatches = groupEvents.flatMap(ev => {
      const ps = new Set(ev.participants||[]);
      return (ev.matches||[]).filter(m=>m.played && ps.has(m.home) && ps.has(m.away));
    });
    const virtualEv = {id:'grp_'+group.id, name:group.name, category:'other', participants:allParticipants, matches:allMatches};
    const ps = new Set(allParticipants);
    html += `<div style="margin-bottom:6px;padding:10px 14px;font-family:'DM Mono',monospace;font-size:13px;color:var(--gold);letter-spacing:1px;text-transform:uppercase;border-bottom:2px solid var(--gold);">🔗 ${group.name} — общая</div>`;
    html += renderStatBlock(virtualEv, ps, group.name + ' — всего');
    html += `<div style="height:16px;"></div>`;

    // Затем каждое событие группы
    groupEvents.forEach((ev, idx) => {
      const ps2 = new Set(ev.participants||[]);
      html += `<div style="margin-bottom:6px;padding:8px 14px;font-family:'DM Mono',monospace;font-size:12px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;">Круг ${idx+1}: ${ev.name}</div>`;
      html += renderStatBlock(ev, ps2, ev.name);
      html += `<div style="height:20px;"></div>`;
    });
    html += `<div style="height:8px;border-top:1px solid var(--border);margin-bottom:16px;"></div>`;
  });

  // Одиночные активные события (не в группах)
  const groupedIds = new Set(groups.flatMap(g=>g.event_ids));
  active.filter(e=>!groupedIds.has(e.id)).forEach(ev => {
    const ps = new Set(ev.participants||[]);
    if(!ev.participants.length) return;
    html += renderStatBlock(ev, ps, null);
  });

  content.innerHTML = html || `<div style="padding:40px;text-align:center;color:var(--text3);">Нет данных</div>`;

  // No auto-scroll needed — newest match is already on the left
}

// ── NAVIGATION ──
const savedTheme = localStorage.getItem('shymatc-theme') || 'dark';
let dark = savedTheme === 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('theme-btn').textContent = dark ? '☀️' : '🌙';
});

function toggleTheme(){
  dark=!dark;
  const theme = dark ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('theme-btn').textContent = dark ? '☀️' : '🌙';
  localStorage.setItem('shymatc-theme', theme);
}

function goPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.getElementById('nav-'+name).classList.add('active');
  document.getElementById('scroll-root').scrollTop=0;
}

loadData();
setInterval(loadData, 60000);
</script>
