<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ShymATC-CHAMP</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ── THEME TOKENS ── */
[data-theme="dark"] {
  --bg:#0c0c14; --surface:#14141f; --surface2:#1a1a28; --surface3:#22222f;
  --border:rgba(255,255,255,.06); --border2:rgba(255,255,255,.1);
  --primary:#4a8cff; --primary-dim:rgba(74,140,255,.12); --primary-solid:#3a7bf0;
  --accent:#ef4444; --accent-dim:rgba(239,68,68,.12);
  --green:#22c55e; --green-dim:rgba(34,197,94,.12);
  --gold:#eab308; --gold-dim:rgba(234,179,8,.12);
  --text:#e8eaf0; --text2:#8b8fa8; --text3:#55586e;
  --shadow:0 1px 4px rgba(0,0,0,.4);
  --shadow-lg:0 4px 16px rgba(0,0,0,.5);
  --header-bg:rgba(12,12,20,.92);
  --gradient-hero:linear-gradient(135deg,#1a1a3e 0%,#0c0c14 100%);
  --bar-fill:rgba(74,140,255,.25);
  --bar-active:var(--primary);
}
[data-theme="light"] {
  --bg:#f0f1f5; --surface:#ffffff; --surface2:#f6f7fa; --surface3:#ecedf2;
  --border:rgba(0,0,0,.06); --border2:rgba(0,0,0,.1);
  --primary:#2563eb; --primary-dim:rgba(37,99,235,.08); --primary-solid:#1d4ed8;
  --accent:#dc2626; --accent-dim:rgba(220,38,38,.08);
  --green:#16a34a; --green-dim:rgba(22,163,74,.08);
  --gold:#ca8a04; --gold-dim:rgba(202,138,4,.08);
  --text:#0f172a; --text2:#64748b; --text3:#94a3b8;
  --shadow:0 1px 3px rgba(0,0,0,.06);
  --shadow-lg:0 4px 12px rgba(0,0,0,.08);
  --header-bg:rgba(255,255,255,.92);
  --gradient-hero:linear-gradient(135deg,#e0e7ff 0%,#f0f1f5 100%);
  --bar-fill:rgba(37,99,235,.12);
  --bar-active:var(--primary);
}

/* ── RESET ── */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;transition:background .25s,color .25s;}

/* ── HEADER ── */
.header{position:fixed;top:0;left:0;right:0;height:54px;background:var(--header-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:100;transition:background .25s,border-color .25s;}
.logo{display:flex;align-items:center;gap:9px;}
.logo-icon{width:30px;height:30px;background:linear-gradient(135deg,var(--primary),#6aa3ff);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;position:relative;overflow:hidden;box-shadow:0 2px 8px rgba(74,140,255,.3);}
.logo-icon::after{content:'';position:absolute;top:-50%;left:-50%;width:100%;height:100%;background:linear-gradient(135deg,rgba(255,255,255,.3),transparent);border-radius:inherit;}
.logo-icon svg{width:16px;height:16px;fill:#fff;}
.svg-icon{display:inline-flex;align-items:center;justify-content:center;}
.svg-icon svg{width:1em;height:1em;fill:currentColor;flex-shrink:0;}
.logo-text{font-weight:800;font-size:16px;letter-spacing:-.2px;color:var(--text);transition:color .25s;}
.logo-text span{color:var(--primary);}
.hdr-right{display:flex;align-items:center;gap:8px;}
.live-ind{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:var(--accent);letter-spacing:.5px;text-transform:uppercase;}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:blink 1.5s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.hdr-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border2);background:var(--surface);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .25s;color:var(--text);}
.hdr-btn:active{transform:scale(.92);}

/* ── SCROLL ── */
.scroll-root{position:fixed;top:54px;left:0;right:0;bottom:58px;overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:1;transition:top .2s;}
@supports(padding:max(0px)){
  .bottom-nav{height:calc(58px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);}
  .scroll-root{bottom:calc(58px + env(safe-area-inset-bottom));}
}
::-webkit-scrollbar{width:0;height:0;}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:58px;background:var(--header-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;z-index:100;transition:background .25s,border-color .25s;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;border:none;background:transparent;font-family:inherit;color:var(--text3);padding:0;transition:color .15s;}
.nav-item.active{color:var(--primary);}
.nav-icon{line-height:0;}
.nav-icon svg{width:22px;height:22px;}
.nav-label{font-size:9px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;}

/* ── PAGE ── */
.page{display:none;}
.page.active{display:block;padding-bottom:12px;}

/* ── SECTION TITLE ── */
.section-title{font-size:18px;font-weight:800;letter-spacing:-.3px;padding:14px 16px 10px;transition:color .25s;}

/* ── CHIPS ── */
.chip-row{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:7px 14px;border-radius:8px;border:1px solid var(--border2);background:var(--surface);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;color:var(--text2);font-family:inherit;}
.chip.active{background:linear-gradient(135deg,var(--primary),#6aa3ff);border-color:var(--primary);color:#fff;box-shadow:0 2px 10px rgba(74,140,255,.25);position:relative;overflow:hidden;}
.chip.active::after{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.2),transparent);pointer-events:none;border-radius:inherit;}
.chip.group-chip{border-color:var(--gold);}
.chip.group-chip.active{background:var(--gold);border-color:var(--gold);color:#000;}

/* ── GLASS / GLOSS ANIMATIONS ── */
@keyframes shimmer{0%{transform:translateX(-100%) rotate(15deg)}100%{transform:translateX(200%) rotate(15deg)}}
@keyframes glowPulse{0%,100%{opacity:.3}50%{opacity:.6}}
@keyframes floatUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes slideInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.glass{position:relative;overflow:hidden;}
.glass::after{content:'';position:absolute;top:-50%;left:-50%;width:30%;height:200%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);transform:rotate(15deg);animation:shimmer 12s ease-in-out infinite;}
[data-theme="light"] .glass::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);}

/* Card gloss overlay — universal */
.stat-card,.event-card,.match-card,.live-match,.chart-card,.prog-block,.card-sec,.table-card,.pl-match,.hero-stat{position:relative;overflow:hidden;}
.stat-card::after,.event-card::after,.match-card::after,.chart-card::after,.prog-block::after,.card-sec::after,.pl-match::after{
  content:'';position:absolute;top:0;left:0;right:0;height:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.03) 0%,transparent 100%);pointer-events:none;border-radius:inherit;
}
[data-theme="light"] .stat-card::after,[data-theme="light"] .event-card::after,[data-theme="light"] .match-card::after,[data-theme="light"] .chart-card::after,[data-theme="light"] .prog-block::after,[data-theme="light"] .card-sec::after,[data-theme="light"] .pl-match::after{
  background:linear-gradient(180deg,rgba(255,255,255,.6) 0%,transparent 100%);
}

/* Hover glass highlight */
.event-card:hover,.match-card:hover,.t-row:hover{background:var(--surface2);}
.hero-stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);transition:transform .2s,box-shadow .2s;}

/* ── HOME: HERO ── */
.hero-card{margin:10px 16px;background:var(--gradient-hero);border:1px solid var(--border2);border-radius:14px;padding:18px;position:relative;overflow:hidden;transition:background .25s,border-color .25s;min-height:170px;}
/* FIFA background image */
.hero-card .hero-bg{position:absolute;top:-10px;right:-20px;bottom:-10px;width:60%;
  background:url('https://upload.wikimedia.org/wikipedia/commons/1/1d/Football_Pallo_valmiina-cropped.jpg') center right/cover no-repeat;
  opacity:.7;mask-image:linear-gradient(to left,rgba(0,0,0,1) 0%,transparent 70%);-webkit-mask-image:linear-gradient(to left,rgba(0,0,0,1) 0%,transparent 70%);pointer-events:none;}
[data-theme="light"] .hero-card .hero-bg{opacity:.5;}
/* Glass shimmer on hero */
.hero-card::after{content:'';position:absolute;top:-60%;left:-60%;width:40%;height:250%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);transform:rotate(20deg);animation:shimmer 14s ease-in-out infinite 2s;pointer-events:none;}
[data-theme="light"] .hero-card::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);}
/* Glow orb */
.hero-card::before{content:'';position:absolute;top:-30px;left:-30px;width:120px;height:120px;
  background:radial-gradient(circle,var(--primary-dim) 0%,transparent 70%);animation:glowPulse 6s ease-in-out infinite;pointer-events:none;}
.hero-eyebrow{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text3);margin-bottom:4px;position:relative;z-index:1;}
.hero-title{font-size:22px;font-weight:900;letter-spacing:-.4px;margin-bottom:2px;position:relative;z-index:1;}
.hero-sub{font-size:12px;color:var(--text2);margin-bottom:14px;font-weight:500;position:relative;z-index:1;}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1;}
.hero-stat{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px 6px;text-align:center;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:all .25s;}
[data-theme="light"] .hero-stat{background:rgba(255,255,255,.65);border-color:rgba(255,255,255,.5);}
.hero-stat-val{font-size:20px;font-weight:900;color:var(--primary);line-height:1;}
.hero-stat-lbl{font-size:9px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);margin-top:2px;}

/* ── HOME: LIVE MATCH ── */
.live-match{margin:0 16px 10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden;transition:all .25s;animation:slideInUp .4s ease;}
.live-match::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--primary),var(--accent));}
.live-match .lm-score{animation:floatUp 3s ease-in-out infinite;}
.lm-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.lm-league{font-size:10px;font-weight:700;color:var(--primary);letter-spacing:.5px;text-transform:uppercase;}
.lm-tag{font-size:9px;font-weight:700;color:var(--text3);letter-spacing:.3px;text-transform:uppercase;}
.lm-body{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;}
.lm-team{display:flex;flex-direction:column;align-items:center;gap:4px;}
.lm-team.home{align-items:flex-end;}
.lm-team.away{align-items:flex-start;}
.lm-badge{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:var(--surface2);border:1px solid var(--border);transition:all .25s;}
.lm-badge img{width:28px;height:28px;object-fit:contain;}
.lm-name{font-size:12px;font-weight:700;text-align:center;max-width:85px;line-height:1.2;color:var(--text);transition:color .25s;}
.lm-score-wrap{text-align:center;}
.lm-score{font-size:32px;font-weight:900;letter-spacing:2px;color:var(--text);}
.lm-score-sub{font-size:9px;color:var(--text3);margin-top:1px;font-weight:500;}

/* ── HOME: STAT CARDS ── */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 16px;margin-bottom:10px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;position:relative;overflow:hidden;transition:all .25s;}
.stat-card::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;border-radius:0 2px 2px 0;}
.stat-card:nth-child(1)::before{background:var(--primary);}
.stat-card:nth-child(2)::before{background:var(--accent);}
.stat-card:nth-child(3)::before{background:var(--green);}
.stat-card:nth-child(4)::before{background:var(--gold);}
.stat-lbl{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.3px;text-transform:uppercase;margin-bottom:4px;transition:color .25s;}
.stat-val{font-size:24px;font-weight:900;line-height:1;}
.stat-card:nth-child(1) .stat-val{color:var(--primary);}
.stat-card:nth-child(2) .stat-val{color:var(--accent);}
.stat-card:nth-child(3) .stat-val{color:var(--green);}
.stat-card:nth-child(4) .stat-val{color:var(--gold);}
.stat-sub{font-size:11px;color:var(--text2);margin-top:3px;font-weight:500;transition:color .25s;}

/* ── HOME: EVENTS ── */
.events-wrap{padding:0 16px;}
.event-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:6px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .15s;}
.event-card:active{transform:scale(.98);background:var(--surface2);}
.ev-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background:var(--surface2);border:1px solid var(--border);transition:all .25s;}
.ev-info{flex:1;min-width:0;}
.ev-name{font-size:14px;font-weight:700;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .25s;}
.ev-meta{font-size:11px;color:var(--text3);font-weight:500;}
.ev-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.badge{font-size:9px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.3px;text-transform:uppercase;}
.badge-live{background:var(--green-dim);color:var(--green);position:relative;overflow:hidden;}
.badge-live::after{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.15),transparent);pointer-events:none;border-radius:inherit;}
.badge-done{background:var(--surface3);color:var(--text3);}
.ev-arrow{font-size:14px;color:var(--text3);}

/* ── STANDINGS TABLE ── */
.standings-wrap{padding:0;}
.table-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin:0 16px;transition:all .25s;}
.t-head{display:grid;padding:8px 12px;background:var(--surface2);border-bottom:1px solid var(--border);transition:all .25s;}
.col-t{grid-template-columns:26px 1fr 24px 24px 24px 24px 26px 26px 26px 32px;}
.th{font-size:9px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text3);text-align:center;transition:color .25s;}
.th.left{text-align:left;}
.t-row{display:grid;padding:9px 12px;border-bottom:1px solid var(--border);align-items:center;position:relative;transition:all .15s;animation:rowIn .25s ease forwards;opacity:0;transform:translateY(3px);}
.t-row:last-child{border-bottom:none;}
.t-row:active{background:var(--surface2);}
@keyframes rowIn{to{opacity:1;transform:translateY(0)}}
.t-row:nth-child(1){animation-delay:.02s}.t-row:nth-child(2){animation-delay:.04s}.t-row:nth-child(3){animation-delay:.06s}.t-row:nth-child(4){animation-delay:.08s}.t-row:nth-child(5){animation-delay:.10s}.t-row:nth-child(6){animation-delay:.12s}.t-row:nth-child(7){animation-delay:.14s}.t-row:nth-child(8){animation-delay:.16s}
.zone-line{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:0 2px 2px 0;}
.rk{font-size:12px;font-weight:700;color:var(--text3);text-align:center;}
.team-c{display:flex;align-items:center;gap:6px;}
.t-ava{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;}
.t-badge{width:18px;height:18px;object-fit:contain;flex-shrink:0;}
.t-nm{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .25s;}
.cn{font-size:11px;font-weight:600;color:var(--text2);text-align:center;transition:color .25s;}
.cp{font-size:15px;font-weight:900;text-align:center;color:var(--primary);}
.gp{color:var(--green)!important;}.gn{color:var(--accent)!important;}
.legend{display:flex;gap:10px;margin:8px 16px 0;flex-wrap:wrap;}
.leg-item{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--text3);font-weight:500;}
.leg-dot{width:7px;height:7px;border-radius:2px;}

/* GROUP TABLES */
.group-tables{display:flex;flex-direction:column;gap:16px;padding:0 16px;}
.group-tables .table-card{margin:0;}
.group-rounds-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.group-col-title{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text3);margin-bottom:6px;}
.group-col-title.overall{color:var(--gold);}
@media(max-width:500px){.group-rounds-row{grid-template-columns:1fr;}}

/* ── MATCHES ── */
.matches-wrap{padding:0 16px;}
.ms-lbl{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text3);padding:6px 0 8px;transition:color .25s;}
.match-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:6px;transition:all .25s;}
.m-date{font-size:9px;font-weight:600;color:var(--text3);letter-spacing:.4px;text-transform:uppercase;margin-bottom:8px;}
.m-body{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;}
.m-team{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;transition:color .25s;}
.m-home{justify-content:flex-end;text-align:right;}
.m-away{justify-content:flex-start;text-align:left;}
.m-badge{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--surface2);border:1px solid var(--border);transition:all .25s;}
.m-badge img{width:18px;height:18px;object-fit:contain;}
.m-badge-txt{font-size:9px;font-weight:800;}
.m-score{font-size:20px;font-weight:900;text-align:center;color:var(--text);min-width:56px;padding:3px 6px;background:var(--surface2);border-radius:8px;border:1px solid var(--border);transition:all .25s;}
.mw{color:var(--text)!important;}.ml{color:var(--text3)!important;}

/* ── STATS ── */
.stats-wrap{padding:0 16px;}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;transition:all .25s;}
.chart-title{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text3);margin-bottom:10px;transition:color .25s;}
.mini-chart-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.mini-chart-wrap::-webkit-scrollbar{display:none;}
.mini-chart{display:flex;align-items:flex-end;gap:3px;height:64px;min-width:max-content;padding:4px 0 0;}
.bc{display:flex;flex-direction:column;align-items:center;gap:2px;}
.bar{width:18px;border-radius:4px 4px 0 0;min-height:3px;}
.blbl{font-size:8px;color:var(--text3);text-align:center;width:18px;font-weight:600;}

/* PROGRESS */
.prog-block{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:10px;transition:all .25s;}
.pb-nums{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:12px 12px 8px;}
.pb-n{text-align:center;}
.pb-val{font-size:22px;font-weight:900;line-height:1;}
.pb-lbl{font-size:9px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:var(--text3);margin-top:2px;}
.pb-bar-outer{height:4px;background:var(--surface3);margin:0 12px 6px;border-radius:3px;overflow:hidden;}
.pb-bar-inner{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--primary),#6aa3ff);transition:width .8s ease;position:relative;overflow:hidden;}
.pb-bar-inner::after{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.3),transparent);}
.pb-footer{display:flex;justify-content:space-between;padding:0 12px 10px;}
.pb-pct{font-size:11px;color:var(--primary);font-weight:700;}
.pb-sub{font-size:10px;color:var(--text3);font-weight:500;}

.pb-toggle:active{background:var(--surface2);}
.pb-toggle-arr{color:var(--primary);font-size:11px;transition:transform .2s;}
.pb-toggle-arr.open{transform:rotate(180deg);}
.pb-pairs{border-top:1px solid var(--border);}
.pb-pair{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-bottom:1px solid var(--border);}
.pb-pair:last-child{border-bottom:none;}
.pb-pair-names{font-size:12px;font-weight:600;color:var(--text);}
.pb-pair-sep{color:var(--text3);margin:0 5px;}
.pb-pair-badge{font-size:9px;padding:2px 7px;border-radius:5px;background:var(--accent-dim);color:var(--accent);font-weight:600;}

/* CARD SEC */
.card-sec{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:10px;transition:all .25s;}
.cs-title{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text3);padding:10px 12px;border-bottom:1px solid var(--border);transition:all .25s;}
.sc-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);transition:border-color .25s;}
.sc-row:last-child{border-bottom:none;}
.sc-rk{font-size:13px;font-weight:700;color:var(--text3);width:20px;text-align:center;flex-shrink:0;}
.sc-av{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;}
.sc-inf{flex:1;}
.sc-nm{font-size:13px;font-weight:700;margin-bottom:1px;transition:color .25s;}
.sc-tm{font-size:10px;color:var(--text3);font-weight:500;}
.sc-g{font-size:20px;font-weight:900;color:var(--primary);}

.player-profile-page{padding:0;}

.player-back{background:none;border:none;color:var(--primary);font-size:20px;cursor:pointer;padding:4px 8px 4px 0;line-height:1;font-weight:600;}
.player-hdr-title{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text3);}
.player-hero{background:var(--surface);border-bottom:1px solid var(--border);padding:18px 16px 14px;transition:all .25s;}
.player-ava-wrap{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.player-ava-lg{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;flex-shrink:0;}
.player-info{flex:1;}
.player-nm{font-size:20px;font-weight:800;margin-bottom:2px;letter-spacing:-.3px;transition:color .25s;}
.player-ev{font-size:10px;color:var(--text3);font-weight:600;letter-spacing:.3px;text-transform:uppercase;}
.pl-stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:6px;}
.pl-stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
.pl-sc{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 4px;text-align:center;transition:all .25s;}
.pl-sv{font-size:20px;font-weight:900;line-height:1;}
.pl-sl{font-size:8px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--text3);margin-top:1px;}
.pl-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);background:var(--surface);transition:all .25s;}
.pl-tab{flex:1;padding:9px;text-align:center;font-size:11px;font-weight:700;letter-spacing:.2px;text-transform:uppercase;cursor:pointer;color:var(--text3);border:none;background:none;border-bottom:2px solid transparent;transition:all .15s;font-family:inherit;}
.pl-tab.active{color:var(--primary);border-bottom-color:var(--primary);}
.pl-tab-content{display:none;}.pl-tab-content.active{display:block;}
.pl-matches-wrap{padding:12px 16px;}
.pl-match{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:6px;transition:all .25s;}
.pl-match-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.pl-match-date{font-size:10px;color:var(--text3);font-weight:500;}
.pl-match-res{font-size:9px;padding:2px 7px;border-radius:5px;font-weight:700;letter-spacing:.3px;}
.pl-win{background:var(--green-dim);color:var(--green);}
.pl-draw{background:var(--surface3);color:var(--text2);}
.pl-lose{background:var(--accent-dim);color:var(--accent);}
.pl-match-body{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;}
.pl-match-team{font-size:13px;font-weight:700;transition:color .25s;}
.pl-match-you{color:var(--primary);}
.pl-mh{text-align:right;}.pl-ma{text-align:left;}
.pl-match-score{font-size:20px;font-weight:900;text-align:center;border-radius:8px;padding:2px 8px;min-width:54px;}
.pl-score-win{color:var(--green);background:var(--green-dim);}
.pl-score-draw{color:var(--text2);background:var(--surface3);}
.pl-score-lose{color:var(--accent);background:var(--accent-dim);}
.pl-pending-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;transition:all .25s;}
.pl-pending-opp{font-size:13px;font-weight:700;}
.pl-pending-badge{font-size:9px;padding:2px 8px;border-radius:5px;background:var(--surface3);color:var(--text3);font-weight:600;}

.ticker-bar{position:fixed;top:54px;left:0;right:0;height:32px;background:var(--primary-solid);overflow:hidden;display:none;align-items:center;z-index:99;}
.ticker-bar.visible{display:flex;}
.ticker-inner{display:flex;align-items:center;white-space:nowrap;animation:ticker 35s linear infinite;}
@keyframes ticker{0%{transform:translateX(100vw)}100%{transform:translateX(-100%)}}
.ticker-text{font-size:11px;font-weight:600;color:#fff;letter-spacing:.3px;}
.ticker-sep{color:rgba(255,255,255,.3);margin:0 18px;font-size:10px;}
.ticker-icon{color:#fff;margin-right:6px;font-size:12px;flex-shrink:0;}

/* FOOTER */
.footer-credit{text-align:center;padding:20px 16px 8px;}
.footer-line{display:flex;align-items:center;justify-content:center;gap:6px;font-size:9px;color:var(--text3);font-weight:600;letter-spacing:.4px;text-transform:uppercase;margin-bottom:4px;}
.footer-line span{width:16px;height:1px;background:var(--border2);}
.footer-line b{color:var(--primary);font-weight:700;}
</style>

// Get team name for a player in current context
function getTeam(ev, playerName) {
  if(!ev) return null;
  const rounds = ev.rounds||[];
  const rt = ev.round_teams||{};
  const pt = ev.participant_teams||{};
  // Try latest round first, then fallback
  for(let i=rounds.length-1;i>=0;i--) {
    const rId = String(rounds[i].id);
    if(rt[rId] && rt[rId][playerName]) return rt[rId][playerName];
  }
  return pt[playerName] || null;
}

// Get club logo <img> or fallback abbreviation
function clubBadge(teamName, size) {
  if(!teamName) return '';
  const sz = size||18;
  const url = CLUB_LOGOS[teamName];
  if(url) return `<img src="${url}" style="width:${sz}px;height:${sz}px;object-fit:contain;" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" alt=""><span style="display:none;width:${sz}px;height:${sz}px;align-items:center;justify-content:center;font-size:${Math.round(sz*.45)}px;font-weight:800;color:var(--text3)">${ini(teamName)}</span>`;
  return `<span style="font-size:${Math.round(sz*.45)}px;font-weight:800;color:var(--text3)">${ini(teamName)}</span>`;
}

function badgeEl(ev, playerName, size) {
  const team = getTeam(ev, playerName);
  return clubBadge(team, size);
}

function allMatches(event){
  const ps=new Set(event.participants||[]);const result=[];
  (event.rounds||[]).forEach(r=>{(r.matches||[]).forEach(m=>{if(m.played&&ps.has(m.home)&&ps.has(m.away))result.push({...m,_round_id:r.id,_round_name:r.name});});});
  return result;
}
function roundMatches(event,rid){
  const ps=new Set(event.participants||[]);const r=(event.rounds||[]).find(r=>r.id===rid);
  if(!r)return[];return(r.matches||[]).filter(m=>m.played&&ps.has(m.home)&&ps.has(m.away));
}
function calcStandingsFromMatches(participants,matches){
  const st={};participants.forEach(p=>{st[p]={name:p,p:0,w:0,d:0,l:0,gf:0,ga:0};});
  matches.forEach(m=>{if(!m.played)return;const{home:h,away:a,score_home:sh,score_away:sa}=m;
  [[h,sh,sa],[a,sa,sh]].forEach(([name,gf,ga])=>{if(st[name]){st[name].p++;st[name].gf+=gf;st[name].ga+=ga;}});
  if(sh>sa){if(st[h])st[h].w++;if(st[a])st[a].l++;}else if(sh<sa){if(st[a])st[a].w++;if(st[h])st[h].l++;}else{if(st[h])st[h].d++;if(st[a])st[a].d++;}});
  return Object.values(st).sort((a,b)=>(b.w*3+b.d)-(a.w*3+a.d)||(b.gf-b.ga)-(a.gf-a.ga));
}
function calcStandings(event){return calcStandingsFromMatches(event.participants||[],allMatches(event));}

function getTickerText(){
  const mode=RAW_DATA?.ticker_mode||'';const events=RAW_DATA?.events||[];const active=events.filter(e=>e.active);const ev=active[0];
  if(!mode&&RAW_DATA?.ticker)return RAW_DATA.ticker;if(mode==='custom')return RAW_DATA?.ticker||'';if(!ev)return'';
  const ps=new Set(ev.participants||[]);const played=allMatches(ev);
  if(mode==='last_match'){if(!played.length)return'';const last=played[played.length-1];const res=last.score_home>last.score_away?`${last.home.toUpperCase()} ПОБЕДИЛ`:last.score_away>last.score_home?`${last.away.toUpperCase()} ПОБЕДИЛ`:'НИЧЬЯ';return`${last.home.toUpperCase()} ${last.score_home}:${last.score_away} ${last.away.toUpperCase()} — ${res}`;}
  if(mode==='leader'){const rows=calcStandings(ev);if(!rows.length)return'';const l=rows[0];return`ЛИДЕР: ${l.name.toUpperCase()} — ${l.w*3+l.d} ОЧК`;}
  if(mode==='top_scorer'){const rows=calcStandings(ev);if(!rows.length)return'';const t=rows.reduce((b,r)=>r.gf>b.gf?r:b);return`БОМБАРДИР: ${t.name.toUpperCase()} — ${t.gf} ГОЛОВ`;}
  if(mode==='top_match'){if(!played.length)return'';const t=played.reduce((b,m)=>(m.score_home+m.score_away)>(b.score_home+b.score_away)?m:b);return`ТОП МАТЧ: ${t.home.toUpperCase()} ${t.score_home}:${t.score_away} ${t.away.toUpperCase()}`;}
  if(mode==='dirty'){const d=ev.dirty_player;if(!d)return'';return`ГРЯЗНЫЙ ИГРОК: ${d.toUpperCase()}`;}
  if(mode==='rounds_progress'){const rounds=ev.rounds||[];const n=ev.participants.length;const tp=Math.round(n*(n-1)/2);if(!rounds.length||!tp)return'';const parts=rounds.map(r=>{const rSet=new Set((r.matches||[]).filter(m=>m.played&&ps.has(m.home)&&ps.has(m.away)).map(m=>[m.home,m.away].sort().join('|||')));return`${r.name.toUpperCase()}: ${Math.round(rSet.size/tp*100)}%`;});return`ПРОГРЕСС: ${parts.join(' · ')}`;}
  return'';
}

  else{const ev=(RAW_DATA?.events||[]).find(e=>e.id===id);if(ev)renderEventTable(ev,content);}}

function calcGroupStandings(eventIds){const events=(RAW_DATA?.events||[]).filter(e=>eventIds.includes(e.id));const all=[...new Set(events.flatMap(e=>e.participants||[]))];const st={};all.forEach(p=>{st[p]={name:p,p:0,w:0,d:0,l:0,gf:0,ga:0};});
  events.forEach(ev=>{allMatches(ev).forEach(m=>{if(!m.played)return;const{home:h,away:a,score_home:sh,score_away:sa}=m;if(st[h]){st[h].p++;st[h].gf+=sh;st[h].ga+=sa;}if(st[a]){st[a].p++;st[a].gf+=sa;st[a].ga+=sh;}
  if(sh>sa){if(st[h])st[h].w++;if(st[a])st[a].l++;}else if(sh<sa){if(st[a])st[a].w++;if(st[h])st[h].l++;}else{if(st[h])st[h].d++;if(st[a])st[a].d++;}});});
  return Object.values(st).sort((a,b)=>(b.w*3+b.d)-(a.w*3+a.d)||(b.gf-b.ga)-(a.gf-a.ga));}

function renderMiniTable(rows,evId,ev){
  if(!rows.length)return`<div style="padding:14px;text-align:center;color:var(--text3);font-size:11px;">Нет данных</div>`;
  return`<div class="table-card"><div class="t-head col-t"><div class="th">#</div><div class="th left">Участник</div><div class="th">И</div><div class="th">В</div><div class="th">Н</div><div class="th">П</div><div class="th">ГЗ</div><div class="th">ГП</div><div class="th">±</div><div class="th">Оч</div></div>
  ${rows.map((r,i)=>{const pts=r.w*3+r.d,gd=r.gf-r.ga;const gdCls=gd>=0?'gp':'gn';const c=COLORS[i%COLORS.length],bg=BGS[i%BGS.length];
    const team=ev?getTeam(ev,r.name):null;const badgeHtml=team&&CLUB_LOGOS[team]?`<img class="t-badge" src="${CLUB_LOGOS[team]}" onerror="this.style.display='none'" alt="">`:'';
    const clickAttr=evId?`onclick="openPlayer('${r.name}','${evId}')" style="cursor:pointer;"`:'';
    return`<div class="t-row col-t" ${clickAttr}><div class="zone-line" style="background:transparent"></div><div class="rk" style="color:${i<3?c:'var(--text3)'}">${medal(i)}</div>
    <div class="team-c">${badgeHtml||`<div class="t-ava" style="background:${bg};color:${c}">${ini(r.name)}</div>`}<div class="t-nm">${r.name}</div></div>
    <div class="cn">${r.p}</div><div class="cn" style="color:var(--green)">${r.w}</div><div class="cn">${r.d}</div><div class="cn" style="color:var(--accent)">${r.l}</div>
    <div class="cn" style="color:var(--primary)">${r.gf}</div><div class="cn" style="color:var(--accent)">${r.ga}</div><div class="cn ${gdCls}">${gd>=0?'+'+gd:gd}</div><div class="cp">${pts}</div></div>`;}).join('')}</div>`;
}

function renderGroupTable(group,container){const events=(RAW_DATA?.events||[]).filter(e=>group.event_ids.includes(e.id));const overallRows=calcGroupStandings(group.event_ids);
  const cols=[{title:svgi(SVG.link,12,true)+' Общая',rows:overallRows,overall:true,evId:null,ev:null},...events.map(ev=>({title:ev.name,rows:calcStandings(ev),overall:false,evId:ev.id,ev:ev}))];
  const roundCols=cols.filter(c=>!c.overall).reverse();const overallCol=cols.find(c=>c.overall);
  container.innerHTML=`<div class="group-tables"><div class="group-table-col"><div class="group-col-title overall">${overallCol.title}</div>${renderMiniTable(overallCol.rows,overallCol.evId,overallCol.ev)}</div>
  <div class="group-rounds-row">${roundCols.map(col=>`<div class="group-table-col"><div class="group-col-title">${col.title}</div>${renderMiniTable(col.rows,col.evId,col.ev)}</div>`).join('')}</div></div>`;}

function renderEventTable(ev,container){const rounds=ev.rounds||[];
  if(rounds.length>1){const overallRows=calcStandings(ev);const cols=[{title:svgi(SVG.link,12,true)+' Общая',rows:overallRows,evId:ev.id,overall:true},...rounds.map(r=>({title:r.name,rows:calcStandingsFromMatches(ev.participants||[],roundMatches(ev,r.id)),evId:ev.id,overall:false}))];
    const roundColsEv=cols.filter(c=>!c.overall).reverse();const overallColEv=cols.find(c=>c.overall);
    container.innerHTML=`<div class="group-tables"><div class="group-table-col"><div class="group-col-title overall">${overallColEv.title}</div>${renderMiniTable(overallColEv.rows,overallColEv.evId,ev)}</div>
    <div class="group-rounds-row">${roundColsEv.map(col=>`<div class="group-table-col"><div class="group-col-title">${col.title}</div>${renderMiniTable(col.rows,col.evId,ev)}</div>`).join('')}</div></div>`;return;}
  const rows=calcStandings(ev);if(!rows.length){container.innerHTML=`<div style="padding:28px;text-align:center;color:var(--text3);font-size:11px;">Участников нет</div>`;return;}
  const rowsHtml=rows.map((r,i)=>{const pts=r.w*3+r.d;const gd=r.gf-r.ga;const zc=i<Math.ceil(rows.length/2)?'var(--primary)':i>=rows.length-Math.floor(rows.length/4)?'var(--accent)':'transparent';const gdCls=gd>=0?'gp':'gn';
    const c=COLORS[i%COLORS.length],bg=BGS[i%BGS.length];const team=getTeam(ev,r.name);const badgeHtml=team&&CLUB_LOGOS[team]?`<img class="t-badge" src="${CLUB_LOGOS[team]}" onerror="this.style.display='none'" alt="">`:'';
    return`<div class="t-row col-t" onclick="openPlayer('${r.name}','${ev.id}')" style="cursor:pointer;"><div class="zone-line" style="background:${zc}"></div><div class="rk" style="color:${i<3?c:'var(--text3)'}">${medal(i)}</div>
    <div class="team-c">${badgeHtml||`<div class="t-ava" style="background:${bg};color:${c}">${ini(r.name)}</div>`}<div class="t-nm">${r.name}</div></div>
    <div class="cn">${r.p}</div><div class="cn" style="color:var(--green)">${r.w}</div><div class="cn">${r.d}</div><div class="cn" style="color:var(--accent)">${r.l}</div>
    <div class="cn" style="color:var(--primary)">${r.gf}</div><div class="cn" style="color:var(--accent)">${r.ga}</div><div class="cn ${gdCls}">${gd>=0?'+'+gd:gd}</div><div class="cp">${pts}</div></div>`;}).join('');
  container.innerHTML=`<div class="table-card"><div class="t-head col-t"><div class="th">#</div><div class="th left">Участник</div><div class="th">И</div><div class="th">В</div><div class="th">Н</div><div class="th">П</div><div class="th">ГЗ</div><div class="th">ГП</div><div class="th">±</div><div class="th">Оч</div></div>${rowsHtml}</div>
  <div class="legend"><div class="leg-item"><div class="leg-dot" style="background:var(--primary)"></div>Топ</div><div class="leg-item"><div class="leg-dot" style="background:var(--accent)"></div>Низ</div></div>`;}

function renderMatches(){
  const events=RAW_DATA?.events||[];const content=document.getElementById('matches-content');
  if(!events.some(ev=>allMatches(ev).length>0)){content.innerHTML=`<div style="padding:32px;text-align:center;color:var(--text3);font-size:11px;">Матчей пока нет</div>`;return;}
  let html='';
  events.slice().reverse().forEach(ev=>{const rounds=ev.rounds||[];const allM=allMatches(ev);const withIdx=allM.map((m,i)=>({...m,_idx:i}));
    const matches=withIdx.sort((a,b)=>{const ra=rounds.findIndex(r=>r.id===a._round_id);const rb=rounds.findIndex(r=>r.id===b._round_id);if(rb!==ra)return rb-ra;return b._idx-a._idx;});
    if(!matches.length)return;html+=`<div class="ms-lbl">${SPORT_ICONS[ev.category]||svgi(SVG.trophy,18)} ${ev.name}</div>`;
    html+=matches.map(m=>{const hw=m.score_home>m.score_away,aw=m.score_away>m.score_home;const roundLabel=m._round_name?' · '+m._round_name:'';
      return`<div class="match-card"><div class="m-date">${m.date||''}${roundLabel}</div>
      <div class="m-body"><div class="m-team m-home ${hw?'mw':'ml'}"><span>${m.home}</span><div class="m-badge">${badgeEl(ev,m.home,18)}</div></div>
      <div class="m-score">${m.score_home} : ${m.score_away}</div>
      <div class="m-team m-away ${aw?'mw':'ml'}"><div class="m-badge">${badgeEl(ev,m.away,18)}</div><span>${m.away}</span></div></div></div>`;}).join('');});
  content.innerHTML=html;
}

function renderStatBlock(ev,ps,label){
  const rows=calcStandings(ev)||[];const goalsRaw=allMatches(ev).map(m=>m.score_home+m.score_away);const goals=goalsRaw.slice().reverse();let html='';
  if(goals.length>0){const mx=Math.max(...goals,1);
    html+=`<div class="chart-card"><div class="chart-title">${label||ev.name} — голы (${goals.length})</div><div class="mini-chart-wrap"><div class="mini-chart">${goals.map((g,i)=>`<div class="bc"><div class="bar" style="height:${Math.round(g/mx*48)}px;background:${i===0?'var(--bar-active)':'var(--bar-fill)'}"></div><div class="blbl">${goals.length-i}</div></div>`).join('')}</div></div></div>`;}
  const n=ev.participants.length;const rounds=ev.rounds||[];const totalPairs=Math.round(n*(n-1)/2);
  if(totalPairs>0){const isMulti=rounds.length>1;const totalSlots=isMulti?totalPairs*rounds.length:totalPairs;const playedM=allMatches(ev);const playedPairsSet=new Set();playedM.forEach(m=>{playedPairsSet.add([m.home,m.away].sort().join('|||'));});
    const playedPairs=isMulti?playedM.length:playedPairsSet.size;const totalForCalc=isMulti?totalSlots:totalPairs;const rem=totalForCalc-playedPairs;const pct=Math.round(playedPairs/totalForCalc*100);
    const unplayed=[];if(!isMulti){for(let i=0;i<ev.participants.length;i++)for(let j=i+1;j<ev.participants.length;j++){const key=[ev.participants[i],ev.participants[j]].sort().join('|||');if(!playedPairsSet.has(key))unplayed.push([ev.participants[i],ev.participants[j]]);}}
    const uid=ev.id+'-'+Math.random().toString(36).slice(2);const pairsListId='pairs-list-'+uid,pairsArrId='pairs-arr-'+uid;
    const unplayedHtml=unplayed.map(([a,b])=>`<div class="pb-pair"><span class="pb-pair-names">${a}<span class="pb-pair-sep">vs</span>${b}</span><span class="pb-pair-badge">не играли</span></div>`).join('');
    html+=`<div class="prog-block"><div class="pb-nums"><div class="pb-n"><div class="pb-val" style="color:var(--primary)">${playedPairs}</div><div class="pb-lbl">${isMulti?'матчей':'сыграли'}</div></div><div class="pb-n"><div class="pb-val" style="color:var(--accent)">${rem}</div><div class="pb-lbl">осталось</div></div><div class="pb-n"><div class="pb-val" style="color:var(--text3)">${totalForCalc}</div><div class="pb-lbl">${isMulti?'всего':'всего пар'}</div></div></div>
    <div class="pb-bar-outer"><div class="pb-bar-inner" style="width:${pct}%"></div></div><div class="pb-footer"><div class="pb-pct">${pct}%</div><div class="pb-sub">${n} уч. · ${rounds.length} кр.</div></div>
    ${(()=>{if(rounds.length>1){let rH='';let tU=0;rounds.forEach(r=>{const rSet=new Set((r.matches||[]).filter(m=>m.played&&ps.has(m.home)&&ps.has(m.away)).map(m=>[m.home,m.away].sort().join('|||')));const rU=[];
      for(let i=0;i<ev.participants.length;i++)for(let j=i+1;j<ev.participants.length;j++){const key=[ev.participants[i],ev.participants[j]].sort().join('|||');if(!rSet.has(key))rU.push([ev.participants[i],ev.participants[j]]);}
      tU+=rU.length;rH+=`<div style="padding:6px 12px 2px;font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;">${r.name} (${rU.length})</div>`;
      if(!rU.length)rH+=`<div style="padding:3px 12px 6px;font-size:10px;color:var(--green);font-weight:600">${svgi(SVG.check,12,true)} Все сыграли</div>`;
      else rH+=rU.map(([a,b])=>`<div class="pb-pair"><span class="pb-pair-names">${a}<span class="pb-pair-sep">vs</span>${b}</span><span class="pb-pair-badge">${r.name}</span></div>`).join('');});
      const u2=ev.id+'-r-'+Math.random().toString(36).slice(2);return tU>0?`<button class="pb-toggle" onclick="togglePairs('pairs-list-${u2}','pairs-arr-${u2}')"><span>${tU} пар осталось</span><span class="pb-toggle-arr" id="pairs-arr-${u2}">▼</span></button><div class="pb-pairs" id="pairs-list-${u2}" style="display:none">${rH}</div>`:`<div style="padding:8px 12px;font-size:10px;color:var(--green);font-weight:600">${svgi(SVG.check,12,true)} Все сыграли!</div>`;}
    else{return rem>0?`<button class="pb-toggle" onclick="togglePairs('${pairsListId}','${pairsArrId}')"><span>${rem} пар осталось</span><span class="pb-toggle-arr" id="${pairsArrId}">▼</span></button><div class="pb-pairs" id="${pairsListId}" style="display:none">${unplayedHtml}</div>`:`<div style="padding:8px 12px;font-size:10px;color:var(--green);font-weight:600">${svgi(SVG.check,12,true)} Все сыграли!</div>`;}})()}</div>`;}
  if(rows.length){html+=`<div class="card-sec"><div class="cs-title">${label||ev.name}</div><div>${rows.slice(0,5).map((r,i)=>{const pts=r.w*3+r.d;const c=COLORS[i%COLORS.length],bg=BGS[i%BGS.length];
    const team=getTeam(ev,r.name);const badgeHtml=team&&CLUB_LOGOS[team]?`<img src="${CLUB_LOGOS[team]}" style="width:22px;height:22px;object-fit:contain" onerror="this.style.display='none'" alt="">`:'';
    const done=ev.participants.filter(o=>o!==r.name).every(o=>new Set(allMatches(ev).map(m=>[m.home,m.away].sort().join('|||'))).has([r.name,o].sort().join('|||')));
    return`<div class="sc-row"><div class="sc-rk">${medal(i)}</div><div class="sc-av" style="background:${bg};color:${c}">${badgeHtml||ini(r.name)}</div><div class="sc-inf"><div class="sc-nm">${r.name}${done?' <span style="font-size:9px">'+svgi(SVG.check,12,true)+'</span>':''}</div><div class="sc-tm">${r.w}П · ${r.d}Н · ${r.l}Пр</div></div><div class="sc-g">${pts}</div></div>`;}).join('')}</div></div>`;}
  return html;
}

function renderStats(){
  const events=RAW_DATA?.events||[];const groups=activeGroups();const content=document.getElementById('stats-content');const active=events.filter(e=>e.active);
  if(!active.length){content.innerHTML=`<div style="padding:32px;text-align:center;color:var(--text3);font-size:11px;">Нет данных</div>`;return;}
  let html='';
  groups.forEach(group=>{const gEvs=(RAW_DATA?.events||[]).filter(e=>group.event_ids.includes(e.id));if(!gEvs.length)return;
    const allP=[...new Set(gEvs.flatMap(e=>e.participants||[]))];const allM=gEvs.flatMap(ev=>allMatches(ev));
    const vEv={id:'grp_'+group.id,name:group.name,category:'other',participants:allP,rounds:[{id:1,name:'all',matches:allM}]};const ps=new Set(allP);
    html+=`<div style="margin-bottom:4px;padding:8px 0;font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.3px;text-transform:uppercase;border-bottom:2px solid var(--gold);">${svgi(SVG.link,12,true)} ${group.name}</div>`;
    html+=renderStatBlock(vEv,ps,group.name);html+=`<div style="height:12px"></div>`;
    gEvs.forEach((ev,idx)=>{const ps2=new Set(ev.participants||[]);html+=`<div style="margin-bottom:4px;padding:6px 0;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;">Круг ${idx+1}: ${ev.name}</div>`;html+=renderStatBlock(ev,ps2,ev.name);html+=`<div style="height:14px"></div>`;});
    html+=`<div style="height:6px;border-top:1px solid var(--border);margin-bottom:12px;"></div>`;});
  const groupedIds=new Set(groups.flatMap(g=>g.event_ids));
  active.filter(e=>!groupedIds.has(e.id)).forEach(ev=>{const ps=new Set(ev.participants||[]);if(!ev.participants.length)return;const rounds=ev.rounds||[];
    if(rounds.length>1){html+=`<div style="margin-bottom:4px;padding:6px 0;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;">${ev.name}</div>`;html+=renderStatBlock(ev,ps,'Общая');html+=`<div style="height:10px"></div>`;
      rounds.slice().reverse().forEach(r=>{const vEv={...ev,rounds:[{...r}]};html+=`<div style="margin-bottom:3px;padding:4px 0;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;">${r.name}</div>`;html+=renderStatBlock(vEv,ps,r.name);html+=`<div style="height:12px"></div>`;});}
    else{html+=renderStatBlock(ev,ps,null);}});
  content.innerHTML=html||`<div style="padding:32px;text-align:center;color:var(--text3);">Нет данных</div>`;
}

// ── THEME ──
const savedTheme=localStorage.getItem('shymatc-theme')||'dark';
let dark=savedTheme==='dark';
document.documentElement.setAttribute('data-theme',savedTheme);
function setThemeIcon(){document.getElementById('theme-icon').innerHTML=dark?SVG.sun:SVG.moon;}
document.addEventListener('DOMContentLoaded',setThemeIcon);
function toggleTheme(){dark=!dark;const t=dark?'dark':'light';document.documentElement.setAttribute('data-theme',t);setThemeIcon();localStorage.setItem('shymatc-theme',t);}

function goPage(name){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));document.getElementById('page-'+name).classList.add('active');document.getElementById('nav-'+name).classList.add('active');document.getElementById('scroll-root').scrollTop=0;}

loadData();setInterval(loadData,60000);
</script>
